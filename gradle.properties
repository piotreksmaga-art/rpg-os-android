org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The workspace and CI sandbox do not guarantee a writable global Kotlin daemon directory.
# In-process compilation is deterministic and avoids a slow failed-daemon fallback on every task.
kotlin.compiler.execution.strategy=in-process
