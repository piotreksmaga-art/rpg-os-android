name: Phase38 Slice C Gate
on:
  push:
    branches: [chat1-phase38-slice-ab-protected-read]
    paths: [.github/workflows/phase38-slice-c-ci.yml]
permissions:
  contents: write
jobs:
  slice-c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - name: Verify Slice C base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 104c69514790ea24874371ba49f12f957da8e89b HEAD
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
          test -f app/src/main/java/com/rpgos/app/Phase38ProtectedRead.kt
          test ! -f app/src/main/java/com/rpgos/app/Phase38AccessAuthority.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Temporary wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Apply immutable Slice C candidate
        id: c
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rpg-os-phase38-ci"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/phase38_integrated_patch.py c
          python3 tools/phase38_integrated_fixups.py c
          git diff --check
          git add app/src/main/java app/src/test/java
          git diff --cached --check
          git commit -m "feat(p38): add universal access authority"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SLICE_C_CANDIDATE_SHA=$sha"
          git status --short
      - name: A+B+C targeted
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace > /tmp/abc-targeted.log 2>&1
          rc=$?
          echo "ABC_TARGETED_RC=$rc"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
          print(f'ABC_TARGETED tests={t} failures={f} skipped={s}');assert t and not f
          PY
          else
            echo '=== TARGETED ERRORS/FAILURES ==='
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/abc-targeted.log | tail -n 300 || true
            echo '=== TARGETED LOG TAIL ==='
            tail -n 260 /tmp/abc-targeted.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.c.outputs.sha }}"
          exit "$rc"
      - name: Isolate targeted XML
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: A+B+C full JVM
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace > /tmp/abc-full.log 2>&1
          rc=$?
          echo "ABC_FULL_RC=$rc"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
          print(f'ABC_FULL tests={t} failures={f} skipped={s}');assert t and not f
          PY
          else
            echo '=== FULL JVM ERRORS/FAILURES ==='
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/abc-full.log | tail -n 400 || true
            echo '=== FULL JVM LOG TAIL ==='
            tail -n 320 /tmp/abc-full.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.c.outputs.sha }}"
          exit "$rc"
      - name: Push green Slice C
        run: |
          set -euo pipefail
          git push origin HEAD:chat1-phase38-slice-ab-protected-read
          echo "SLICE_C_GREEN_SHA=${{ steps.c.outputs.sha }}"
