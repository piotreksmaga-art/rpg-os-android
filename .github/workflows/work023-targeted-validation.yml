name: WORK-023 Targeted Validation

on:
  push:
    branches: [ "work023-targeted-validation" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: 1 A08 alone
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase26To29PostAuditBlockerRepairTest.A08_project_direct_writer_fails_and_canonical_succeeds' --stacktrace

      - name: 2 Phase15 and project-domain regressions
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.*Phase15*' --tests 'com.rpgos.app.*DevelopmentProject*' --stacktrace

      - name: 3 Full Phase26To29 blocker repair test
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase26To29PostAuditBlockerRepairTest' --stacktrace

      - name: 3b Semantic forgeability regression
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Work023CanonicalForgeabilitySemanticTest' --stacktrace

      - name: 4 Ownership regressions
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.*Ownership*' --stacktrace

      - name: 5 All Phase26 through Phase29 tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase26*' --tests 'com.rpgos.app.Phase27*' --tests 'com.rpgos.app.Phase28*' --tests 'com.rpgos.app.Phase29*' --stacktrace

      - name: 6 CampaignTruthChange integration
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.CampaignTruthChangeIntegrationTest' --stacktrace

      - name: 7 Phase19 through Phase25 regressions
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase19*' --tests 'com.rpgos.app.Phase20*' --tests 'com.rpgos.app.Phase21*' --tests 'com.rpgos.app.Phase22*' --tests 'com.rpgos.app.Phase23*' --tests 'com.rpgos.app.Phase24*' --tests 'com.rpgos.app.Phase25*' --stacktrace

      - name: 8 Full JVM suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
