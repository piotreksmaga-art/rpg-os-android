name: GM141 Backend Knowledge Contract
on:
  push:
    branches:
      - gm-engine-141-foundation
    paths:
      - .github/workflows/gm141-backend-knowledge-contract.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - run: python tools/gm141_backend_knowledge_patch.py
      - run: |
          grep -q 'KNOWLEDGE_PROPAGATE' backend/app.py
          grep -q 'Never invent a knowledge transmission' backend/app.py
          git config user.name rpg-os-ci
          git config user.email actions@users.noreply.github.com
          git add backend/app.py
          git diff --cached --check
          git commit -m 'GM Engine 141: expose explicit NPC knowledge propagation to backend'
          git push origin HEAD:gm-engine-141-foundation
