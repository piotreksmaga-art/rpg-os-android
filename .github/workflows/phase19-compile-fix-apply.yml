name: Phase 19 compile fix apply
on:
  push:
    branches: [ master ]
    paths:
      - scripts/phase19_compile_fix_apply.py
      - .github/workflows/phase19-compile-fix-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - run: python3 scripts/phase19_compile_fix_apply.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/rpgos/app/PlayerDomainEngineReferenceClassificationTest.kt \
                  app/src/test/java/com/rpgos/app/PlayerDomainEngineReferenceFinanceTest.kt \
                  app/src/test/java/com/rpgos/app/PlayerDomainEngineReferenceRegressionTest.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19HardeningTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "test: repair Phase 19 hardening call sites"
          git push origin HEAD:master
