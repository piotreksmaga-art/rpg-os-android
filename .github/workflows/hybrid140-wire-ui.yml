name: Hybrid 140 Wire UI
on:
  push:
    branches: [ "hybrid-updates-140" ]
    paths: [ '.github/workflows/hybrid140-wire-ui.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert content update panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/rpgos/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          anchor = '''            item{
                          Surface(
                              onClick={developerExpanded=!developerExpanded},'''
          if 'ContentUpdatesPanel(context)' not in s:
              if anchor not in s:
                  raise SystemExit('settings anchor not found')
              s = s.replace(anchor, '''            item { ContentUpdatesPanel(context) }
          
                      item{
                          Surface(
                              onClick={developerExpanded=!developerExpanded},''', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit UI wiring and clean this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hybrid140-wire-ui.yml
          git add app/src/main/java/com/rpgos/app/MainActivity.kt
          git commit -m "Hybrid updates: show content updates in settings"
          git push
