name: Phase38 Slice AB Validation

on:
  push:
    branches: [ "chat1-phase38-slice-ab-protected-read" ]

permissions:
  contents: write

concurrency:
  group: phase38-slice-ab-validation
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[p38-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - name: Apply exact integration patch
        run: python3 tools/phase38_apply_slice_ab_patch.py
      - name: Diff hygiene
        run: git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Temporary Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Targeted Phase38 A+B
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace
      - name: Targeted summary
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests=fail=skip=0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(f).getroot();tests+=int(r.attrib.get('tests',0));fail+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));skip+=int(r.attrib.get('skipped',0))
          print(f'TARGETED_SUMMARY tests={tests} failures={fail} skipped={skip}')
          if fail: raise SystemExit(1)
          PY
      - name: Full JVM
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Full JVM summary
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests=fail=skip=0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(f).getroot();tests+=int(r.attrib.get('tests',0));fail+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));skip+=int(r.attrib.get('skipped',0))
          print(f'FULL_JVM_SUMMARY tests={tests} failures={fail} skipped={skip}')
          if fail: raise SystemExit(1)
          PY
      - name: Remove temporary wrapper and commit tested code
        run: |
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          git config user.name "rpg-os-phase38-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java app/src/test/java backend/app.py
          git diff --cached --check
          git commit -m "feat(p38): protected read boundary and consumer inventory"
          git push origin HEAD:chat1-phase38-slice-ab-protected-read
