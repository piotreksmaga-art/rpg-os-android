name: Phase37 Follow-up 2
on:
  push:
    branches: ["chat3-phase37-post-audit-hardening"]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'trigger lineage qualification fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat3-phase37-post-audit-hardening
          fetch-depth: 0
      - run: python3 tools/phase37_followup2.py
      - run: git diff --check
      - run: |
          git config user.name "rpg-os-phase37-hardening-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/Phase37WorldActorKnowledge.kt
          git commit -m "fix(p37): qualify parent acquisition holder"
          git push origin HEAD:chat3-phase37-post-audit-hardening
