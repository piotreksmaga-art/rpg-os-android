name: P19 Fix Focused Test
on:
  push:
    branches: [agent/p19-writer-crash-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p19-writer-crash-hardening
      - shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/test/java/com/rpgos/app/Phase19WriterCrashRecoveryHardeningTest.kt')
          s = p.read_text()
          s = s.replace('campaign = true)', 'isCampaign = true)')
          s = s.replace('campaign = false)', 'isCampaign = false)')
          s = s.replace('required: String, campaign: Boolean)', 'required: String, isCampaign: Boolean)')
          s = s.replace('if (campaign) worldPack', 'if (isCampaign) worldPack')
          s = s.replace('if (campaign) campaign(target', 'if (isCampaign) campaign(target')
          p.write_text(s)
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test/java/com/rpgos/app/Phase19WriterCrashRecoveryHardeningTest.kt
          git commit -m "test: fix Phase 19 writer race fixture naming"
          git push origin HEAD:agent/p19-writer-crash-hardening
