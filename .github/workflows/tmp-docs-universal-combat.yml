name: tmp docs universal combat
on:
  push:
    branches: [docs-universal-combat-adaptive-runtime]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/patch_universal_combat_docs.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/Architektura\ projektu.md docs/Roadmap.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: define universal combat and adaptive turn runtime"
          git push
