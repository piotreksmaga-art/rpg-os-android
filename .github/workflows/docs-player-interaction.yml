name: Player Interaction Docs
on:
  push:
    branches: ["docs-player-interaction-ux"]
permissions:
  contents: write
jobs:
  update-docs:
    if: contains(github.event.head_commit.message, 'temporary player interaction docs trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-player-interaction-ux
          fetch-depth: 0
      - run: python3 tools/apply_player_interaction_docs.py
      - run: |
          git diff --check
          git diff -- "docs/Architektura projektu.md" "docs/Roadmap.md"
      - run: |
          git config user.name "rpg-os-docs-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- "docs/Architektura projektu.md" "docs/Roadmap.md"
          git commit -m "docs: add player interaction orchestrator and safe undo"
          git push origin HEAD:docs-player-interaction-ux
