name: Publish RPG OS ALPHA

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: "Globally accepted cumulative runtime SHA to publish"
        required: true
        type: string
      confirm_release_owner:
        description: "Type CHAT-6 to confirm release-owner authority"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Enforce CHAT-6 release ownership
        shell: bash
        run: |
          if [ "${{ inputs.confirm_release_owner }}" != "CHAT-6" ]; then
            echo "::error::Application publication is owned by CHAT-6."
            exit 1
          fi

      - name: Checkout accepted runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact accepted SHA
        shell: bash
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "${{ inputs.accepted_sha }}" ]; then
            echo "::error::Checkout SHA $ACTUAL does not match accepted SHA ${{ inputs.accepted_sha }}."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK, NDK and Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers ninja-build
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Unable to read app version."
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=RPG-OS-ALPHA-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Reject release-version reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.version.outputs.tag }} already exists; published version identity is immutable. Bump the user-facing version before CHAT-6 publication."
            exit 1
          fi

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.RPGOS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RPGOS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RPGOS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing RPG OS signing secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rpgos-release.jks"
          chmod 600 "$RUNNER_TEMP/rpgos-release.jks"
          echo "RPGOS_KEYSTORE_PATH=$RUNNER_TEMP/rpgos-release.jks" >> "$GITHUB_ENV"
          echo "RPGOS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RPGOS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate release workflow separation
        run: python3 tools/validate_release_workflows.py

      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build signed ALPHA APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare publication files
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"
          SHA=$(sha256sum "${{ steps.version.outputs.apk }}" | awk '{print $1}')
          printf '%s  %s\n' "$SHA" "${{ steps.version.outputs.apk }}" > "${{ steps.version.outputs.apk }}.sha256"
          cat > update.json <<EOF
          {
            "schema": 1,
            "version_name": "${{ steps.version.outputs.name }}",
            "version_code": ${{ steps.version.outputs.code }},
            "sha256": "$SHA",
            "mandatory": false,
            "accepted_sha": "${{ inputs.accepted_sha }}",
            "notes": "RPG OS ALPHA ${{ steps.version.outputs.name }}"
          }
          EOF

      - name: Upload publication evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPG-OS-PUBLISH-${{ steps.version.outputs.name }}-${{ inputs.accepted_sha }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
            update.json
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.apk }}" \
            "${{ steps.version.outputs.apk }}.sha256" \
            update.json \
            --target "${{ inputs.accepted_sha }}" \
            --title "RPG OS ALPHA ${{ steps.version.outputs.name }}" \
            --notes "CHAT-6 cumulative accepted application release.\n\nAccepted runtime: ${{ inputs.accepted_sha }}\nVersion: ${{ steps.version.outputs.name }}\nVersionCode: ${{ steps.version.outputs.code }}"
