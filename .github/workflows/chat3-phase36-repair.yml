name: CHAT3 Phase36 Repair Validation

# TEMPORARY branch-only validation runner. Remove before handoff.
on:
  push:
    branches: [ "chat3-phase36-post-audit-repair" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Targeted Phase36
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase36SchemaVersioningTest' --tests 'com.rpgos.app.Phase36PostAuditEdgeCaseTest' --tests 'com.rpgos.app.Phase30To36PostAuditHardeningTest' --tests 'com.rpgos.app.Phase33SnapshotSystemTest' --stacktrace
      - name: Full JVM
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
