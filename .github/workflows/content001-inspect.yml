name: Content001 Inspect Naruto Worldpack
on:
  push:
    branches: [ "content-001-third-raikage" ]
    paths: [ '.github/workflows/content001-inspect.yml' ]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect worldpack
        shell: bash
        run: |
          rm -rf /tmp/naruto_wp && mkdir -p /tmp/naruto_wp
          unzip -q app/src/main/assets/Naruto.worldpack.zip -d /tmp/naruto_wp
          find /tmp/naruto_wp -maxdepth 3 -type f -printf '%P\n' | sort > NARUTO_WORLDPACK_FILES.txt
          if [ -f /tmp/naruto_wp/world.db ]; then
            sqlite3 /tmp/naruto_wp/world.db '.tables' > NARUTO_WORLDPACK_SCHEMA.txt
            printf '\n--- SCHEMA ---\n' >> NARUTO_WORLDPACK_SCHEMA.txt
            sqlite3 /tmp/naruto_wp/world.db '.schema' >> NARUTO_WORLDPACK_SCHEMA.txt
          else
            echo 'world.db not found' > NARUTO_WORLDPACK_SCHEMA.txt
          fi
      - name: Commit inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NARUTO_WORLDPACK_FILES.txt NARUTO_WORLDPACK_SCHEMA.txt
          git commit -m 'Content 001: record Naruto worldpack schema'
          git push
