name: Publish RPG OS ALPHA hybrid145 User Authorized

on:
  push:
    branches:
      - release/authorized-hybrid145

permissions:
  contents: write
  actions: read

env:
  ACCEPTED_SHA: 97d560b955cffd132f03ef79f106ac8a05c0f64a
  VALIDATION_RUN_ID: "31953200345"
  VALIDATION_ARTIFACT_ID: "9265286704"
  VERSION_NAME: 1.2.0-alpha5-hybrid145
  VERSION_CODE: "145"
  EXPECTED_APK_SHA256: 037f171e26de4cc4fd9ebd1b6c88279623a6a49362808a9d1d4c5e7c3ec2a098
  USER_PUBLICATION_AUTHORIZED: "YES"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify one-time user authorization and frozen master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$USER_PUBLICATION_AUTHORIZED" = "YES"
          MASTER_SHA=$(gh api repos/${GITHUB_REPOSITORY}/branches/master --jq '.commit.sha')
          test "$MASTER_SHA" = "$ACCEPTED_SHA" || { echo "::error::master=$MASTER_SHA expected=$ACCEPTED_SHA"; exit 1; }
          if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION_NAME already exists; immutable version identity cannot be reused."
            exit 1
          fi

      - name: Verify exact validation run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_SHA=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$VALIDATION_RUN_ID --jq '.head_sha')
          RUN_STATUS=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$VALIDATION_RUN_ID --jq '.status')
          RUN_CONCLUSION=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$VALIDATION_RUN_ID --jq '.conclusion')
          ART_SHA=$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/$VALIDATION_ARTIFACT_ID --jq '.workflow_run.head_sha')
          ART_EXPIRED=$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/$VALIDATION_ARTIFACT_ID --jq '.expired')
          test "$RUN_SHA" = "$ACCEPTED_SHA"
          test "$RUN_STATUS" = "completed"
          test "$RUN_CONCLUSION" = "success"
          test "$ART_SHA" = "$ACCEPTED_SHA"
          test "$ART_EXPIRED" = "false"

      - name: Download exact validated immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir validated
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATION_ARTIFACT_ID}/zip" \
            -o validated.zip
          unzip -q validated.zip -d validated

      - name: Verify validated APK bytes and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find validated -type f -name '*.apk' -print -quit)
          test -n "$APK"
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_APK_SHA256" || { echo "::error::APK SHA=$ACTUAL expected=$EXPECTED_APK_SHA256"; exit 1; }
          PROV=$(find validated -type f -name 'build-provenance.json' -print -quit)
          test -n "$PROV"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["head_sha"]==sys.argv[2]; assert str(d["workflow_run_id"])==sys.argv[3]; assert d["version_name"]==sys.argv[4]; assert str(d["version_code"])==sys.argv[5]; assert d["apk_sha256"]==sys.argv[6]; assert d["publication"] is False' "$PROV" "$ACCEPTED_SHA" "$VALIDATION_RUN_ID" "$VERSION_NAME" "$VERSION_CODE" "$EXPECTED_APK_SHA256"
          cp "$APK" "RPG-OS-ALPHA-$VERSION_NAME.apk"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "RPG-OS-ALPHA-$VERSION_NAME.apk" > "RPG-OS-ALPHA-$VERSION_NAME.apk.sha256"
          printf '{\n  "schema": 1,\n  "version_name": "%s",\n  "version_code": %s,\n  "sha256": "%s",\n  "mandatory": false,\n  "accepted_sha": "%s",\n  "validation_run_id": %s,\n  "notes": "RPG OS — cumulative accepted implementation through Phase 19"\n}\n' "$VERSION_NAME" "$VERSION_CODE" "$EXPECTED_APK_SHA256" "$ACCEPTED_SHA" "$VALIDATION_RUN_ID" > update.json

      - name: Create immutable accepted tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$ACCEPTED_SHA" || { echo "::error::existing tag=$EXISTING expected=$ACCEPTED_SHA"; exit 1; }
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$TAG" -f sha="$ACCEPTED_SHA" >/dev/null
          fi

      - name: Publish exact validated APK as immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION_NAME" \
            "RPG-OS-ALPHA-$VERSION_NAME.apk" \
            "RPG-OS-ALPHA-$VERSION_NAME.apk.sha256" \
            update.json \
            --verify-tag \
            --title "RPG OS ALPHA $VERSION_NAME" \
            --notes "RPG OS — cumulative accepted implementation through Phase 19. Publication explicitly authorized by the project owner. Accepted release candidate: $ACCEPTED_SHA. Validation run: $VALIDATION_RUN_ID. VersionCode: $VERSION_CODE. Phase 20 is NOT STARTED."

      - name: Verify published release identity and APK hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v$VERSION_NAME --jq '.object.sha')
          test "$TAG_SHA" = "$ACCEPTED_SHA" || { echo "::error::tag=$TAG_SHA expected=$ACCEPTED_SHA"; exit 1; }
          mkdir published
          gh release download "v$VERSION_NAME" -p "RPG-OS-ALPHA-$VERSION_NAME.apk" -D published
          PUBLISHED_SHA=$(sha256sum "published/RPG-OS-ALPHA-$VERSION_NAME.apk" | awk '{print $1}')
          test "$PUBLISHED_SHA" = "$EXPECTED_APK_SHA256" || { echo "::error::published APK SHA=$PUBLISHED_SHA expected=$EXPECTED_APK_SHA256"; exit 1; }
          echo "PUBLISHED_APK_SHA256=$PUBLISHED_SHA"

      - name: Upload publication verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: RPG-OS-PUBLICATION-VERIFICATION-${{ env.VERSION_NAME }}-${{ env.ACCEPTED_SHA }}
          path: |
            RPG-OS-ALPHA-${{ env.VERSION_NAME }}.apk.sha256
            update.json
          if-no-files-found: error
          retention-days: 30
