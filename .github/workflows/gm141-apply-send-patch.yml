name: GM141 Apply Send Patch
on:
  push:
    branches: [ "gm-engine-141-foundation" ]
    paths: [ ".github/workflows/gm141-apply-send-patch.yml" ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - name: Inject GM141 route
        run: python tools/gm141_inject_send.py
      - name: Verify and commit ViewModel only
        run: |
          grep -q 'if (_settings.value.gm141Enabled)' app/src/main/java/com/rpgos/app/RpgOsViewModel.kt
          grep -q 'GameMasterChatBridge141' app/src/main/java/com/rpgos/app/RpgOsViewModel.kt
          test "$(grep -c 'fun send(text: String)' app/src/main/java/com/rpgos/app/RpgOsViewModel.kt)" = "1"
          git config user.name "rpg-os-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/RpgOsViewModel.kt
          git diff --cached --check
          git commit -m "GM Engine 141: route chat through feature flag"
          git push origin HEAD:gm-engine-141-foundation
