name: Phase 19 final hotfix applicator

on:
  push:
    branches: [ master ]
    paths:
      - scripts/p19_final_hotfix.py
      - .github/workflows/phase19-final-hotfix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply authority and enum hotfix
        run: python3 scripts/p19_final_hotfix.py
      - name: Commit forward-only hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/WorldRuleProvider.kt \
                  app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt \
                  app/src/main/java/com/rpgos/app/CampaignSelectionManager.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19Test.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19HardeningTest.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19BlockerReproductionTest.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19FinalHotfixTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Phase 19: bind rules to authoritative World Pack and harden enum state"
          git push origin HEAD:master
