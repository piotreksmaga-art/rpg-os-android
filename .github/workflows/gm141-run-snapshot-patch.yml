name: GM141 Run Snapshot Patch
on:
  push:
    branches:
      - gm-engine-141-foundation
    paths:
      - .github/workflows/gm141-run-snapshot-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - run: python tools/gm141_snapshot_retention_patch.py
      - run: |
          grep -q SnapshotRetention141 app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          grep -q 'override suspend fun pruneSnapshots' app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          grep -q 'db.insertOrThrow("gm_turns"' app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          git config user.name rpg-os-ci
          git config user.email actions@users.noreply.github.com
          git add app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          git diff --cached --check
          git commit -m 'GM Engine 141: prune old snapshots and forbid turn replacement'
          git push origin HEAD:gm-engine-141-foundation
