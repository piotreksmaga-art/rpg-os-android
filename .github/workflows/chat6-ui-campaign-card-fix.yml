name: CHAT-6 campaign card navigation fix

on:
  push:
    branches: [ "chat6/ui-campaign-card-continue" ]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: chat6/ui-campaign-card-continue

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply minimal navigation fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/rpgos/app/MainActivity.kt')
          s = p.read_text()

          saves_pattern = re.compile(
              r'(?m)^\s*AppRoute\.SAVES -> StandardPage\(\n'
              r'\s*title = "Zapisy i kampanie",\n'
              r'\s*onBack = \{ route = AppRoute\.HOME \}\n'
              r'\s*\) \{ PackagesScreen\(vm\) \}'
          )
          saves_replacement = '''        AppRoute.SAVES -> StandardPage(
              title = "Zapisy i kampanie",
              onBack = { route = AppRoute.HOME }
          ) {
              PackagesScreen(
                  vm = vm,
                  onContinueCampaign = { dirName ->
                      vm.activateCampaign(dirName)
                      route = AppRoute.CAMPAIGN
                  }
              )
          }'''
          s, n = saves_pattern.subn(saves_replacement, s, count=1)
          assert n == 1, f'SAVES route pattern count={n}'

          signature_pattern = re.compile(
              r'@Composable\nprivate fun PackagesScreen\(vm\s*:\s*RpgOsViewModel\)\s*\{'
          )
          signature_replacement = '''internal fun handleCampaignCardAction(
              active: Boolean,
              dirName: String,
              activateCampaign: (String) -> Unit,
              continueCampaign: ((String) -> Unit)?
          ) {
              if (active && continueCampaign != null) {
                  continueCampaign(dirName)
              } else {
                  activateCampaign(dirName)
              }
          }

          @Composable
          private fun PackagesScreen(
              vm: RpgOsViewModel,
              onContinueCampaign: ((String) -> Unit)? = null
          ) {'''
          s, n = signature_pattern.subn(signature_replacement, s, count=1)
          assert n == 1, f'PackagesScreen signature pattern count={n}'

          button_pattern = re.compile(
              r'(text\s*=\s*if\(active\)\s*"Kontynuuj"\s*else\s*"Aktywuj kampanię",\n\s*)'
              r'onClick\s*=\s*\{\s*vm\.activateCampaign\(dirName\)\s*\},'
          )
          button_replacement = r'''\1onClick = {
                                      handleCampaignCardAction(
                                          active = active,
                                          dirName = dirName,
                                          activateCampaign = vm::activateCampaign,
                                          continueCampaign = onContinueCampaign
                                      )
                                  },'''
          s, n = button_pattern.subn(button_replacement, s, count=1)
          assert n == 1, f'campaign button pattern count={n}'
          p.write_text(s)

          test = Path('app/src/test/java/com/rpgos/app/CampaignCardContinueNavigationTest.kt')
          test.write_text('''package com.rpgos.app

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class CampaignCardContinueNavigationTest {
              @Test
              fun activeCampaignUsesContinueNavigationWhenAvailable() {
                  val calls = mutableListOf<String>()

                  handleCampaignCardAction(
                      active = true,
                      dirName = "Naruto_Default",
                      activateCampaign = { calls += "activate:$it" },
                      continueCampaign = { calls += "continue:$it" }
                  )

                  assertEquals(listOf("continue:Naruto_Default"), calls)
              }

              @Test
              fun inactiveCampaignOnlyActivates() {
                  val calls = mutableListOf<String>()

                  handleCampaignCardAction(
                      active = false,
                      dirName = "Naruto_Default",
                      activateCampaign = { calls += "activate:$it" },
                      continueCampaign = { calls += "continue:$it" }
                  )

                  assertEquals(listOf("activate:Naruto_Default"), calls)
              }

              @Test
              fun activeCampaignWithoutNavigatorFallsBackToActivation() {
                  val calls = mutableListOf<String>()

                  handleCampaignCardAction(
                      active = true,
                      dirName = "Naruto_Default",
                      activateCampaign = { calls += "activate:$it" },
                      continueCampaign = null
                  )

                  assertEquals(listOf("activate:Naruto_Default"), calls)
              }
          }
          ''')
          PY

      - name: Run focused regression
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.rpgos.app.CampaignCardContinueNavigationTest --stacktrace

      - name: Run full JVM regression
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit tested fix without temporary workflow
        shell: bash
        run: |
          rm .github/workflows/chat6-ui-campaign-card-fix.yml
          git config user.name "CHAT-6"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/MainActivity.kt app/src/test/java/com/rpgos/app/CampaignCardContinueNavigationTest.kt .github/workflows/chat6-ui-campaign-card-fix.yml
          git commit -m "fix: open campaign from active campaign card"
          git push origin HEAD:chat6/ui-campaign-card-continue
