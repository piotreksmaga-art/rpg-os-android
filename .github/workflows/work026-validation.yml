name: WORK-026 Branch Validation

on:
  push:
    branches: [ "work026-final-architectural-enforcement" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: 1 Project validation
        run: gradle --no-daemon :app:tasks --stacktrace

      - name: 2 Production single-path initialization
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Work026ProductionInitializationEnforcementTest' --stacktrace

      - name: 3 Progression end-to-end commit
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Work026ProgressionCommitIntegrationTest' --stacktrace

      - name: 4 Authoritative store single-path and prior blocker regressions
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase26To29PostAuditBlockerRepairTest' --tests 'com.rpgos.app.Work023OwnershipCanonicalIntegrationTest' --tests 'com.rpgos.app.Work023CanonicalForgeabilitySemanticTest' --stacktrace

      - name: 5 Phase26 through Phase29 suite
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase26*' --tests 'com.rpgos.app.Phase27*' --tests 'com.rpgos.app.Phase28*' --tests 'com.rpgos.app.Phase29*' --stacktrace

      - name: 6 Phase19 through Phase25 regressions
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase19*' --tests 'com.rpgos.app.Phase20*' --tests 'com.rpgos.app.Phase21*' --tests 'com.rpgos.app.Phase22*' --tests 'com.rpgos.app.Phase23*' --tests 'com.rpgos.app.Phase24*' --tests 'com.rpgos.app.Phase25*' --stacktrace

      - name: 7 Full JVM suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
