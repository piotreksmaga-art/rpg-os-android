name: WORK-026 Branch Validation

on:
  push:
    branches: [ "work026-final-architectural-enforcement" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Project validation
        run: gradle --no-daemon :app:tasks --stacktrace
      - name: JVM suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
