name: Living World Docs Expansion

on:
  push:
    branches: ["docs-living-world-motivation-expansion"]

permissions:
  contents: write

jobs:
  update-docs:
    if: contains(github.event.head_commit.message, 'temporary Living World docs trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-living-world-motivation-expansion
          fetch-depth: 0
      - name: Apply docs patch
        run: python3 tools/apply_living_world_expansion_docs.py
      - name: Verify
        run: |
          git diff --check
          git diff -- "docs/Architektura projektu.md" "docs/Roadmap.md"
      - name: Commit docs
        run: |
          git config user.name "rpg-os-docs-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- "docs/Architektura projektu.md" "docs/Roadmap.md"
          git commit -m "docs: expand Living World motivation and causality"
          git push origin HEAD:docs-living-world-motivation-expansion
