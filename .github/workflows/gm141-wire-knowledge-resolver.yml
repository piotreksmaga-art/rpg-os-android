name: GM141 Wire Knowledge Resolver
on:
  push:
    branches:
      - gm-engine-141-foundation
    paths:
      - .github/workflows/gm141-wire-knowledge-resolver.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - run: python tools/gm141_wire_knowledge_resolver.py
      - run: |
          grep -q 'KNOWLEDGE_PROPAGATE' app/src/main/java/com/rpgos/app/GameMasterRuleResolver141.kt
          grep -q 'GameMasterKnowledgeResolver141' app/src/main/java/com/rpgos/app/GameMasterRuleResolver141.kt
          git config user.name rpg-os-ci
          git config user.email actions@users.noreply.github.com
          git add app/src/main/java/com/rpgos/app/GameMasterRuleResolver141.kt
          git diff --cached --check
          git commit -m 'GM Engine 141: gate NPC beliefs through durable knowledge sources'
          git push origin HEAD:gm-engine-141-foundation
