name: CHAT-6 P19 Atomic Authority Hotfix Test

on:
  push:
    branches: [ "chat6/p19-atomic-authority-hotfix" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Focused atomic and freshness tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.rpgos.app.WorldRuleProviderPhase19AtomicAuthorityTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19AuthorityFreshnessTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19*'
          --stacktrace
      - name: Full JVM regression
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: gradle --no-daemon :app:assembleDebug --stacktrace
