name: Elemental 131 compile verification

on:
  push:
    branches: [ "elemental-131" ]
    paths:
      - ".github/workflows/elemental131-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout elemental-131
        uses: actions/checkout@v4
        with:
          ref: elemental-131
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace

      - name: Compile Elemental 131 debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/elemental131-verify.yml
          git commit -m "Elemental 131: compile verified [skip ci]"
          git push origin HEAD:elemental-131
