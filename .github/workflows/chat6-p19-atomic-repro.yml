name: CHAT-6 P19 Atomic Authority Repro

on:
  push:
    branches: [ "chat6/p19-atomic-authority-repro" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run controlled torn-authority reproducer
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.WorldRuleProviderPhase19AtomicAuthorityReproTest' --stacktrace
