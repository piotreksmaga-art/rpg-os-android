name: Content001 Build Third Raikage
on:
  push:
    branches: [ "content-001-third-raikage" ]
    paths: [ '.github/workflows/content001-build.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Naruto content v2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/naruto_wp /tmp/content001
          mkdir -p /tmp/naruto_wp /tmp/content001 content/packages
          unzip -q app/src/main/assets/Naruto.worldpack.zip -d /tmp/naruto_wp
          DB=/tmp/naruto_wp/world.db

          sqlite3 "$DB" <<'SQL'
          BEGIN;
          INSERT OR REPLACE INTO canon_sources(source_uid,source_type,title,url,authority_tier,notes)
          VALUES
          ('SRC-NARUTOPEDIA-THIRD-RAIKAGE','wiki_reference','A (Third Raikage) | Narutopedia','https://naruto.fandom.com/wiki/A_%28Third_Raikage%29',3,'Secondary reference cross-checked against manga citations.'),
          ('SRC-NARUTO-OFFICIAL-HELL-STAB','official_site','The Piercing One-Fingered Thrust of Hell | NARUTO OFFICIAL SITE','https://naruto-official.com/en/news/01_1483',1,'Official Naruto site confirmation of the Third Raikage technique.');

          INSERT OR REPLACE INTO canon_characters_v2(character_uid,name,clan_uid,village_uid,country_uid,rank_title,era_tags,canon_scope,source_uid,notes,wiki_url)
          VALUES('CHAR-THIRD-RAIKAGE','A (Third Raikage)',NULL,'VIL-KUMO','COUNTRY-LIGHTNING','Third Raikage','Third Shinobi World War; pre-series; Fourth Shinobi World War (reincarnated)','manga','SRC-NARUTOPEDIA-THIRD-RAIKAGE','Third Raikage of Kumogakure, renowned for extreme durability, enormous chakra reserves and stamina. Fought Gyūki to a standstill, repeatedly subdued the Eight-Tails, and held off roughly ten thousand enemy shinobi for three days and nights so his comrades could escape. His chest scar was caused by his own Hell Stab during the Eight-Tails battle.','https://naruto.fandom.com/wiki/A_%28Third_Raikage%29');

          INSERT OR REPLACE INTO canon_entities(canon_uid,entity_type,name,canon_scope,summary,source_uid,verification_status)
          VALUES('CHAR-THIRD-RAIKAGE','character','A (Third Raikage)','manga','Third Raikage of Kumogakure; famed as the village’s exceptionally powerful Raikage. His Lightning Release Chakra Mode formed the basis of his strongest shield, while Hell Stab served as his strongest spear.','SRC-NARUTOPEDIA-THIRD-RAIKAGE','verified');

          INSERT OR REPLACE INTO canon_technique_index(technique_uid,name,category,rank,element_key,kekkei_genkai_uid,inventor_uid,earliest_era,canon_scope,source_uid,notes,wiki_url,verification_status,village_uid,clan_uid,is_hiden)
          VALUES
          ('CTECH-HELL-STAB','Hell Stab','nintaijutsu','B','lightning',NULL,NULL,'Third Raikage era','manga','SRC-NARUTO-OFFICIAL-HELL-STAB','Third Raikage concentrates Lightning Release chakra into the fingers of one hand. Reducing the number of fingers increases the technique’s piercing power; the one-finger form is the apex.','https://naruto.fandom.com/wiki/Hell_Stab','verified_core','VIL-KUMO',NULL,0),
          ('CTECH-LIGHTNING-STRAIGHT','Lightning Straight','nintaijutsu',NULL,'lightning',NULL,NULL,'Third Raikage era','manga','SRC-NARUTOPEDIA-THIRD-RAIKAGE','Close-range lightning-enhanced straight strike used by the Third Raikage.','https://naruto.fandom.com/wiki/A_%28Third_Raikage%29','verified_core','VIL-KUMO',NULL,0);

          INSERT OR IGNORE INTO canon_technique_users(technique_uid,character_uid,evidence_scope) VALUES
          ('CTECH-BLACK-LIGHTNING','CHAR-THIRD-RAIKAGE','manga'),
          ('CTECH-LIGHTNING-RELEASE-CHAKRA-MODE','CHAR-THIRD-RAIKAGE','manga'),
          ('CTECH-BODY-FLICKER-TECHNIQUE','CHAR-THIRD-RAIKAGE','manga'),
          ('CTECH-HELL-STAB','CHAR-THIRD-RAIKAGE','manga'),
          ('CTECH-LIGHTNING-STRAIGHT','CHAR-THIRD-RAIKAGE','manga');

          INSERT OR REPLACE INTO canon_traits(canon_uid,trait_key,trait_value,source_uid) VALUES
          ('CHAR-THIRD-RAIKAGE','sex','male','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','birthdate','August 1','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','status','deceased','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','height','205 cm','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','weight','105.1 kg','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','blood_type','O','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','occupation','Raikage','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','affiliation','Kumogakure','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','team','Eight-Tails Subduing Team','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','chakra_nature','Lightning Release','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','chakra_nature','Earth Release','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','chakra_nature','Fire Release','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','combat_specialty','nintaijutsu; extreme durability; high-speed close combat','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','epithet_defense','strongest shield','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','epithet_offense','strongest spear (Hell Stab)','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','stamina_feat','fought approximately 10,000 enemy shinobi for three days and nights to allow allies to escape','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','biju_feat','fought Gyūki (Eight-Tails) to a standstill and participated in repeated subjugations','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','durability_weakness','his own Hell Stab was capable of piercing his otherwise exceptional defense','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','black_lightning_legacy','developed/used Black Lightning and passed its secret to Darui','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','family','A (Fourth Raikage) — son; Killer B — adopted son; Blue B — nephew','SRC-NARUTOPEDIA-THIRD-RAIKAGE');

          INSERT OR IGNORE INTO canon_links(from_uid,relation_type,to_uid,source_uid) VALUES
          ('CHAR-THIRD-RAIKAGE','affiliated_with','VIL-KUMO','SRC-NARUTOPEDIA-THIRD-RAIKAGE'),
          ('CHAR-THIRD-RAIKAGE','located_in','COUNTRY-LIGHTNING','SRC-NARUTOPEDIA-THIRD-RAIKAGE');
          COMMIT;
          SQL

          sqlite3 -header -column "$DB" "SELECT character_uid,name,village_uid,country_uid,rank_title,era_tags,source_uid FROM canon_characters_v2 WHERE character_uid='CHAR-THIRD-RAIKAGE';" > /tmp/content001/verify.txt
          sqlite3 "$DB" "SELECT COUNT(*) FROM canon_traits WHERE canon_uid='CHAR-THIRD-RAIKAGE';" >> /tmp/content001/verify.txt
          sqlite3 "$DB" "SELECT COUNT(*) FROM canon_technique_users WHERE character_uid='CHAR-THIRD-RAIKAGE';" >> /tmp/content001/verify.txt

          (cd /tmp/naruto_wp && zip -qr "$GITHUB_WORKSPACE/content/packages/Naruto-v2.zip" .)
          SHA=$(sha256sum content/packages/Naruto-v2.zip | awk '{print $1}')
          SIZE=$(stat -c%s content/packages/Naruto-v2.zip)
          python3 - "$SHA" "$SIZE" <<'PY'
          import json,sys
          sha,size=sys.argv[1],int(sys.argv[2])
          data={
            'schemaVersion':1,
            'channel':'alpha',
            'generatedAt':'2026-08-08T14:22:00Z',
            'packages':[{
              'id':'Naruto','type':'WORLD','version':2,'minEngineVersionCode':140,
              'downloadUrl':'https://raw.githubusercontent.com/piotreksmaga-art/rpg-os-android/master/content/packages/Naruto-v2.zip',
              'sha256':sha,'sizeBytes':size,
              'description':'Naruto Content 002: szczegółowy kanoniczny profil Trzeciego Raikage (A), techniki, cechy i relacje.'
            }]
          }
          open('content/channel-alpha.json','w').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          cp /tmp/content001/verify.txt CONTENT001_VERIFY.txt
      - name: Commit package and manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/packages/Naruto-v2.zip content/channel-alpha.json CONTENT001_VERIFY.txt
          git commit -m 'Content 001: publish Third Raikage Naruto world update'
          git push
