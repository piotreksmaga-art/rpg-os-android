name: P18 one-shot fixture patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: apply p18 fixture patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Patch legacy test helpers to named PlayerCommand arguments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/rpgos/app/PlayerDomainEngineTest.kt')
          s = p.read_text()
          replacements = {
            'private fun train()=PlayerCommand("CMD-TRAIN","C1",actor,PlayerCommandKinds.TRAIN,TrainCommandPayload(DomainRef("STAT","STR"),10,"METHOD"),CommandProvenance("TEST"),"CAUSE","CORR",17,listOf(ExpectedRecordVersion(DomainRef("PLAYER","P1"),3)))': 'private fun train()=PlayerCommand(commandUid="CMD-TRAIN",campaignUid="C1",actor=actor,commandKindUid=PlayerCommandKinds.TRAIN,payload=TrainCommandPayload(DomainRef("STAT","STR"),10,"METHOD"),provenance=CommandProvenance("TEST"),causationUid="CAUSE",correlationUid="CORR",requestedEffectiveOrder=17,preconditions=listOf(ExpectedRecordVersion(DomainRef("PLAYER","P1"),3)))',
            'private fun financeCommand()=PlayerCommand("CMD-FIN","C1",actor,PlayerCommandKinds.TRANSFER_FUNDS,TransferFundsCommandPayload("ACCOUNT:A","ACCOUNT:B",125,"CUR:PLN"),CommandProvenance("TEST"),"CAUSE-F","CORR-F",18)': 'private fun financeCommand()=PlayerCommand(commandUid="CMD-FIN",campaignUid="C1",actor=actor,commandKindUid=PlayerCommandKinds.TRANSFER_FUNDS,payload=TransferFundsCommandPayload("ACCOUNT:A","ACCOUNT:B",125,"CUR:PLN"),provenance=CommandProvenance("TEST"),causationUid="CAUSE-F",correlationUid="CORR-F",requestedEffectiveOrder=18)',
            'private fun assetCommand()=PlayerCommand("CMD-ASSET","C1",actor,PlayerCommandKinds.ACQUIRE_ASSET,AcquireAssetCommandPayload("RPGOS-ASSET-KIND:PROPERTY:BUSINESS"),CommandProvenance("TEST"))': 'private fun assetCommand()=PlayerCommand(commandUid="CMD-ASSET",campaignUid="C1",actor=actor,commandKindUid=PlayerCommandKinds.ACQUIRE_ASSET,payload=AcquireAssetCommandPayload("RPGOS-ASSET-KIND:PROPERTY:BUSINESS"),provenance=CommandProvenance("TEST"))',
            'private fun projectWork(e:List<DomainRef> = listOf(DomainRef("EVIDENCE","E1")))=PlayerCommand("CMD-PROJECT","C1",actor,PlayerCommandKinds.RECORD_PROJECT_WORK,RecordProjectWorkCommandPayload("PROJECT:P1","EXPERIMENT",10,"METHOD",e),CommandProvenance("TEST"),"CAUSE-P","CORR-P",19)': 'private fun projectWork(e:List<DomainRef> = listOf(DomainRef("EVIDENCE","E1")))=PlayerCommand(commandUid="CMD-PROJECT",campaignUid="C1",actor=actor,commandKindUid=PlayerCommandKinds.RECORD_PROJECT_WORK,payload=RecordProjectWorkCommandPayload("PROJECT:P1","EXPERIMENT",10,"METHOD",e),provenance=CommandProvenance("TEST"),causationUid="CAUSE-P",correlationUid="CORR-P",requestedEffectiveOrder=19)'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected helper not found: {old[:60]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/test/java/com/rpgos/app/PlayerDomainEngineTest.kt
          git commit -m 'test: restore named PlayerCommand fixture construction'
          git push origin HEAD:master
