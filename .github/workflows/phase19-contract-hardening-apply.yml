name: Phase 19 contract hardening apply

on:
  push:
    branches: [ master ]
    paths:
      - scripts/phase19_contract_hardening_apply.py
      - .github/workflows/phase19-contract-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply focused Phase 19 patch
        run: python3 scripts/phase19_contract_hardening_apply.py
      - name: Commit forward-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt \
                  app/src/main/java/com/rpgos/app/CampaignSelectionManager.kt \
                  app/src/test/java/com/rpgos/app/PlayerDomainEngineTest.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19Test.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19BlockerReproductionTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce Phase 19 bound world-rule mode"
          git push origin HEAD:master
