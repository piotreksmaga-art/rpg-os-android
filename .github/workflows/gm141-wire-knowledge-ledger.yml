name: GM141 Wire Knowledge Ledger
on:
  push:
    branches:
      - gm-engine-141-foundation
    paths:
      - .github/workflows/gm141-wire-knowledge-ledger.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - run: python tools/gm141_wire_knowledge_ledger.py
      - run: |
          grep -q 'gm_knowledge_transmissions' app/src/main/java/com/rpgos/app/CampaignSourceOfTruthDb.kt
          grep -q 'KnowledgeTransmissionStore141' app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          grep -q 'appendKnowledgeTransmission' app/src/main/java/com/rpgos/app/GameMasterPersistence141.kt
          git config user.name rpg-os-ci
          git config user.email actions@users.noreply.github.com
          git add app/src/main/java/com/rpgos/app/CampaignSourceOfTruthDb.kt app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt app/src/main/java/com/rpgos/app/GameMasterPersistence141.kt
          git diff --cached --check
          git commit -m 'GM Engine 141: persist NPC knowledge transmission ledger atomically'
          git push origin HEAD:gm-engine-141-foundation
