name: UI139 Global Contrast
on:
  push:
    branches:
      - ui-139-global-contrast
    paths:
      - 'tools/ui139_global_contrast.py'
      - '.github/workflows/ui-139-global-contrast.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-139-global-contrast
          fetch-depth: 0
      - name: Apply global contrast fix
        run: python3 tools/ui139_global_contrast.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build
        run: gradle --no-daemon :app:assembleDebug
      - name: Commit UI 139
        run: |
          git config user.name piotreksmaga-art
          git config user.email piotreksmaga@gmail.com
          git add app/src/main/java/com/rpgos/app/MainActivity.kt app/build.gradle.kts
          git commit -m "UI 139 - global contrast and typography fix"
          git push origin HEAD:ui-139-global-contrast
