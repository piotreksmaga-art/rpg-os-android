name: Phase 19 authority fixture correction
on:
  push:
    branches: [ master ]
    paths:
      - scripts/p19_probe_fixture_fix.py
      - .github/workflows/p19-probe-fixture-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - run: python3 scripts/p19_probe_fixture_fix.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19FinalHotfixTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "test: correct Phase 19 authority provider fixture"
          git push origin HEAD:master
