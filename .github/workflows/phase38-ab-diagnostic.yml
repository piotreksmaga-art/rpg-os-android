name: Phase38 A+B Diagnostic
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0', cache-read-only: true}
      - name: Materialize immutable A+B source candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.5.0
          chmod +x gradlew

          if [ ! -f app/src/main/java/com/rpgos/app/Phase38ProtectedRead.kt ]; then
            python3 tools/phase38_integrated_patch.py hardening
            python3 tools/phase38_integrated_fixups.py hardening
            python3 tools/phase38_ab_gate_fixups_robust2.py
            python3 tools/phase38_contextbuilder_gate_fix.py
            python3 tools/phase38_ab_fulljvm_compat_fix.py
            git diff --check

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main app/src/test backend
            if ! git diff --cached --quiet; then
              git commit -m "feat(p38): materialize A+B protected-read hardening"
              git push origin HEAD:chat1-phase38-slice-ab-protected-read
            fi
          else
            echo "A+B protected-read source already materialized at current HEAD"
            git diff --check
          fi

          echo "IMMUTABLE_TESTED_SHA=$(git rev-parse HEAD)"
          test -f app/src/main/java/com/rpgos/app/Phase38ProtectedRead.kt
          git status --short
      - name: Targeted A+B gate
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace > /tmp/p38.log 2>&1
          rc=$?
          echo "P38_RC=$rc"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -ne 0 ]; then
            echo '=== KOTLIN/JAVA ERRORS ==='
            grep -E '(^e: file:| error: |Compilation error|Unresolved reference|overrides nothing|Cannot access|Type mismatch|No value passed|Too many arguments)' /tmp/p38.log | tail -n 240 || true
            echo '=== TEST FAILURES ==='
            grep -E '(FAILED|AssertionError|expected:|but was:|There were failing tests|FAILURE: Build failed)' /tmp/p38.log | tail -n 240 || true
            echo '=== LOG TAIL ==='
            tail -n 220 /tmp/p38.log
          else
            python3 -c "import glob,xml.etree.ElementTree as E; rs=[E.parse(x).getroot() for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]; t=sum(int(r.attrib.get('tests',0)) for r in rs); f=sum(int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0)) for r in rs); s=sum(int(r.attrib.get('skipped',0)) for r in rs); print(f'AB_TARGETED tests={t} failures={f} skipped={s}'); assert t and not f"
            grep -E 'BUILD SUCCESSFUL' /tmp/p38.log | tail -n 5 || true
          fi
          exit "$rc"
      - name: Full JVM A+B gate
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace > /tmp/full.log 2>&1
          rc=$?
          echo "FULL_RC=$rc"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -ne 0 ]; then
            echo '=== FULL JVM FAILURES ==='
            grep -E '(FAILED|AssertionError|expected:|but was:|There were failing tests|FAILURE: Build failed)' /tmp/full.log | tail -n 300 || true
            echo '=== FULL JVM LOG TAIL ==='
            tail -n 260 /tmp/full.log
          else
            python3 -c "import glob,xml.etree.ElementTree as E; rs=[E.parse(x).getroot() for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]; t=sum(int(r.attrib.get('tests',0)) for r in rs); f=sum(int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0)) for r in rs); s=sum(int(r.attrib.get('skipped',0)) for r in rs); print(f'AB_FULL_JVM tests={t} failures={f} skipped={s}'); assert t and not f"
            grep -E 'BUILD SUCCESSFUL' /tmp/full.log | tail -n 5 || true
          fi
          exit "$rc"
