name: P18 classification diagnostics
on:
  push:
    paths:
      - '.github/workflows/p18-classification-diagnostics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run full JVM tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Print failed test XML
        if: always()
        shell: bash
        run: |
          find app/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -exec grep -H -n -E '<failure|<error|tests="|failures="|errors="' {} \; || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p18-classification-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
