name: GM141 Snapshot Retention Patch
on:
  push:
    branches: [ "gm-engine-141-foundation" ]
    paths: [ ".github/workflows/gm141-snapshot-retention-patch.yml" ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - name: Patch SQLite snapshot retention and immutable insert
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt')
          s=p.read_text()
          old=') : UnifiedCampaignRepository, Closeable {'
          new=') : UnifiedCampaignRepository, SnapshotRetention141, Closeable {'
          if s.count(old)!=1: raise SystemExit('class declaration mismatch')
          s=s.replace(old,new,1)

          old='''        require(db.insertWithOnConflict("gm_turns", null, values, SQLiteDatabase.CONFLICT_REPLACE) != -1L) {
            "Nie można zapisać tury ${turn.turnId}."
        }
'''
          new='''        require(db.insertOrThrow("gm_turns", null, values) != -1L) {
            "Nie można zapisać tury ${turn.turnId}."
        }
'''
          if s.count(old)!=1: raise SystemExit('writeTurn insert mismatch')
          s=s.replace(old,new,1)

          marker='''    override suspend fun <T> inTransaction(block: suspend UnifiedCampaignRepository.() -> T): T {
'''
          method='''    override suspend fun pruneSnapshots(campaignUid: EntityUid, keepNewest: Int) {
        requireCampaign(campaignUid)
        require(keepNewest >= 1) { "keepNewest musi być >= 1." }
        require(transactionDepth == 0 && !db.inTransaction()) {
            "Retencji snapshotów nie wolno wykonywać wewnątrz aktywnej transakcji."
        }

        val currentSnapshotId = db.rawQuery(
            "SELECT current_snapshot_id FROM gm_campaign_meta WHERE campaign_id=? LIMIT 1",
            arrayOf(campaignUid.value)
        ).use { c -> if (c.moveToFirst() && !c.isNull(0)) c.getString(0) else null }

        data class SnapshotFile(val id: String, val path: String?)
        val stale = mutableListOf<SnapshotFile>()
        db.rawQuery(
            """
            SELECT snapshot_id,storage_path FROM gm_snapshots
            WHERE campaign_id=?
            ORDER BY turn_number DESC, created_at DESC
            """.trimIndent(),
            arrayOf(campaignUid.value)
        ).use { c ->
            var index = 0
            while (c.moveToNext()) {
                val id = c.getString(0)
                val path = if (c.isNull(1)) null else c.getString(1)
                if (index >= keepNewest && id != currentSnapshotId) stale += SnapshotFile(id, path)
                index++
            }
        }

        stale.forEach { snapshot ->
            snapshot.path?.takeIf { it.isNotBlank() }?.let { path ->
                runCatching { File(path).takeIf(File::exists)?.delete() }
            }
            db.delete(
                "gm_snapshots",
                "campaign_id=? AND snapshot_id=?",
                arrayOf(campaignUid.value, snapshot.id)
            )
        }
    }

'''
          if s.count(marker)!=1: raise SystemExit('transaction marker mismatch')
          s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Verify and commit SQLite file only
        run: |
          grep -q 'SnapshotRetention141' app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          grep -q 'override suspend fun pruneSnapshots' app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          grep -q 'db.insertOrThrow("gm_turns"' app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          git config user.name "rpg-os-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/SQLiteUnifiedCampaignRepository.kt
          git diff --cached --check
          git commit -m "GM Engine 141: prune old snapshots and forbid turn replacement"
          git push origin HEAD:gm-engine-141-foundation
