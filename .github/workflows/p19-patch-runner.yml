name: Phase 19 patch runner
on:
  push:
    paths:
      - 'tools/p19_apply_integrity_patch.py'
    branches:
      - agent/p19-final-integrity-hardening
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p19-final-integrity-hardening
      - run: python3 tools/p19_apply_integrity_patch.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add app/src/test/java/com/rpgos/app/Phase19FinalIntegrityHardeningTest.kt
          git diff --cached --check
          git commit -m 'test: fix final integrity concurrency fixture typing'
          git push origin HEAD:agent/p19-final-integrity-hardening
