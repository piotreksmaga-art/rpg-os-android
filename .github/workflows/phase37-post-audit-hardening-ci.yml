name: Phase37 Post-Audit Hardening

on:
  push:
    branches:
      - chat3-phase37-post-audit-hardening

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: chat3-phase37-post-audit-hardening
          fetch-depth: 0

      - name: Verify isolated audited base ancestry
        shell: bash
        run: git merge-base --is-ancestor 7d94c30ac47f23e44cbe7515a267512c3d6ad4de HEAD

      - name: Apply Phase37 post-audit hardening
        run: python3 tools/phase37_post_audit_hardening.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Run targeted Phase37 hardening suite
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase37WorldActorKnowledgeTest' --stacktrace

      - name: Run full JVM suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Count JVM tests
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=fail=err=skip=0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              r=ET.parse(f).getroot()
              total += int(r.attrib.get('tests',0))
              fail += int(r.attrib.get('failures',0))
              err += int(r.attrib.get('errors',0))
              skip += int(r.attrib.get('skipped',0))
          print(f'JVM_TEST_COUNT={total}')
          print(f'JVM_FAILURES={fail+err}')
          print(f'JVM_SKIPPED={skip}')
          if fail or err:
              raise SystemExit(1)
          PY

      - name: Commit tested hardening only
        shell: bash
        run: |
          git config user.name "rpg-os-phase37-hardening-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/rpgos/app/Phase37WorldActorKnowledge.kt \
            app/src/main/java/com/rpgos/app/Phase37KnowledgeChangeCodec.kt \
            app/src/main/java/com/rpgos/app/Phase37PostAuditHardening.kt \
            app/src/main/java/com/rpgos/app/GameplayMutationGate.kt \
            app/src/main/java/com/rpgos/app/GameplayRuntimeBootstrap.kt \
            app/src/main/java/com/rpgos/app/WorldRuleProvider.kt \
            app/src/test/java/com/rpgos/app/Phase37WorldActorKnowledgeTest.kt
          git commit -m "fix(p37): harden post-audit knowledge boundaries"
          git push origin HEAD:chat3-phase37-post-audit-hardening
