name: Chat1 Phase35-36 Final Validation

on:
  push:
    branches: [ "chat1-phase35-36-post-audit-repair" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat1-phase35-36-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase35-36-post-audit-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Targeted post-audit matrix
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.rpgos.app.Phase35CanonDivergenceTest' \
            --tests 'com.rpgos.app.Phase36SchemaVersioningTest' \
            --tests 'com.rpgos.app.Phase30To36PostAuditHardeningTest' \
            --tests 'com.rpgos.app.Phase33SnapshotSystemTest' \
            --tests 'com.rpgos.app.Phase34SnapshotRetentionTest' \
            --tests 'com.rpgos.app.Phase26To29PostAuditBlockerRepairTest' \
            --tests 'com.rpgos.app.Phase32EvidenceNonAuthorityTest' \
            --tests 'com.rpgos.app.Work036Phase30To32PostAuditRepairTest' \
            --stacktrace 2>&1 | tee /tmp/chat1_targeted.log

      - name: Full JVM suite
        id: full
        if: steps.targeted.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/chat1_full.log

      - name: Publish validation evidence
        if: always()
        run: |
          git config user.name "chat1-rpgos-repair"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "VALIDATED_HEAD=$(git rev-parse HEAD)"
            echo "TARGETED_OUTCOME=${{ steps.targeted.outcome }}"
            echo "FULL_OUTCOME=${{ steps.full.outcome }}"
            echo "--- TARGETED SUMMARY ---"
            grep -E 'tests completed|BUILD SUCCESSFUL|BUILD FAILED|FAILED$' /tmp/chat1_targeted.log | tail -n 80 || true
            echo "--- FULL SUMMARY ---"
            if [ -f /tmp/chat1_full.log ]; then grep -E 'tests completed|BUILD SUCCESSFUL|BUILD FAILED|FAILED$' /tmp/chat1_full.log | tail -n 120 || true; fi
            echo "--- TARGETED FAILURES ---"
            if [ -d app/build/test-results/testDebugUnitTest ]; then grep -R -n -E '<failure|<error' app/build/test-results/testDebugUnitTest | head -n 120 || true; fi
          } > tools/chat1_phase35_36_final_validation.txt
          git add tools/chat1_phase35_36_final_validation.txt
          git diff --cached --quiet || git commit -m "test: record Phase 35-36 final validation [skip ci]"
          git push origin HEAD:chat1-phase35-36-post-audit-repair

      - name: Enforce green validation
        if: steps.targeted.outcome != 'success' || steps.full.outcome != 'success'
        run: exit 1
