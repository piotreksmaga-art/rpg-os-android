name: Phase38 docs patch

on:
  push:
    branches:
      - docs-phase38-universal-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic documentation patch
        run: python3 tools/phase38_docs_patch.py
      - name: Remove temporary patch tooling
        run: |
          rm -f tools/phase38_docs_patch.py
          rm -f .github/workflows/phase38-docs-patch.yml
      - name: Commit final documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: define universal Phase 38 visibility contract"
          git push origin HEAD:docs-phase38-universal-contract
