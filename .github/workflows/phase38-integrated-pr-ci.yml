name: Phase38 Slice D Exact SHA Observable Gate
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate-slice-d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d660daf7506a018e3027c95fe8ea263b57b587f
          fetch-depth: 0
      - name: Verify immutable Slice D candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9d660daf7506a018e3027c95fe8ea263b57b587f"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
          git diff --check cf77ac7a19ccf607051a68d19c099590dca1c3ff..HEAD
          test -z "$(git diff --name-only cf77ac7a19ccf607051a68d19c099590dca1c3ff..HEAD | grep -E '^app/src/main/java/com/rpgos/app/Phase32' || true)"
          test -z "$(git diff --name-only cf77ac7a19ccf607051a68d19c099590dca1c3ff..HEAD | grep -E '^backend/' || true)"
          test -z "$(git diff --name-only cf77ac7a19ccf607051a68d19c099590dca1c3ff..HEAD | grep -E '^docs/' || true)"
          changed="$(git diff --name-only cf77ac7a19ccf607051a68d19c099590dca1c3ff..HEAD)"
          test "$changed" = $'app/src/main/java/com/rpgos/app/Phase38PerceptionDisclosure.kt\napp/src/test/java/com/rpgos/app/Phase38SliceDPerceptionDisclosureTest.kt'
      - name: Slice D universality static audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/rpgos/app/Phase38PerceptionDisclosure.kt')
          text=p.read_text(); s=text.lower()
          banned=['naruto','shinobi','ninja','chakra','bleach','reiatsu','witcher','wizard','dragon','jedi','radar','telepathy','magic sight']
          bad=[x for x in banned if x in s]
          print('SLICE_D_UNIVERSALITY_BAD',bad); assert not bad
          assert 'KnowledgeStore(' not in text
          assert 'KnowledgeAcquisitionChange(' not in text
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0', cache-read-only: true}
      - name: Temporary wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: TARGETED exact-SHA gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace
          gradle_status=$?
          set -e
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          t=f=s=0;bad=[]
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=E.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
              for tc in r.findall('testcase'):
                  q=tc.find('failure') or tc.find('error')
                  if q is not None: bad.append(f"{tc.attrib.get('classname')}::{tc.attrib.get('name')} {q.attrib.get('message','')}")
          print(f'SLICE_D_TARGETED tests={t} failures={f} skipped={s}')
          for x in bad: print('SLICE_D_TARGETED_FAILURE',x)
          assert t and not f
          PY
          test "$gradle_status" -eq 0
          test "$(git rev-parse HEAD)" = "9d660daf7506a018e3027c95fe8ea263b57b587f"
      - name: Isolate targeted XML and results
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: FULL JVM exact-SHA gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
          gradle_status=$?
          set -e
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          t=f=s=0;bad=[]
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=E.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
              for tc in r.findall('testcase'):
                  q=tc.find('failure') or tc.find('error')
                  if q is not None: bad.append(f"{tc.attrib.get('classname')}::{tc.attrib.get('name')} {q.attrib.get('message','')}")
          print(f'SLICE_D_FULL tests={t} failures={f} skipped={s}')
          for x in bad: print('SLICE_D_FULL_FAILURE',x)
          assert t and not f
          PY
          test "$gradle_status" -eq 0
          test "$(git rev-parse HEAD)" = "9d660daf7506a018e3027c95fe8ea263b57b587f"
      - name: Confirm integrated green candidate
        run: echo "SLICE_D_GREEN_SHA=9d660daf7506a018e3027c95fe8ea263b57b587f"
