name: Phase38 Slice C Exact SHA Observable Gate
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate-slice-c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - name: Capture immutable validation SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "VALIDATION_SHA=$(git rev-parse HEAD)"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
          git diff --quiet 2a894b614e74c1888ad901b666fd923e4bd15d32..HEAD -- app/src/main/java app/src/test/java backend
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0', cache-read-only: true}
      - name: Temporary wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Phase38 targeted exact-SHA gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          rs=[E.parse(x).getroot() for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]
          t=sum(int(r.attrib.get('tests',0)) for r in rs); f=sum(int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0)) for r in rs); s=sum(int(r.attrib.get('skipped',0)) for r in rs)
          print(f'SLICE_C_TARGETED tests={t} failures={f} skipped={s}'); assert t and not f
          PY
          test "$(git rev-parse HEAD)" = "${{ steps.sha.outputs.sha }}"
      - name: Isolate targeted XML
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: Full JVM exact-SHA gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          rs=[E.parse(x).getroot() for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]
          t=sum(int(r.attrib.get('tests',0)) for r in rs); f=sum(int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0)) for r in rs); s=sum(int(r.attrib.get('skipped',0)) for r in rs)
          print(f'SLICE_C_FULL tests={t} failures={f} skipped={s}'); assert t and not f
          PY
          test "$(git rev-parse HEAD)" = "${{ steps.sha.outputs.sha }}"
      - name: Confirm exact-SHA green
        run: echo "SLICE_C_GREEN_SHA=${{ steps.sha.outputs.sha }}"
