name: Phase61-62 NPC Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches:
      - "chat/phase61-62-*"

permissions:
  contents: read

concurrency:
  group: phase61-62-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  # A repair must not cancel an older SHA and erase its acceptance evidence.
  cancel-in-progress: false

jobs:

  full-jvm-variant:
    # Complete shared coverage lives in the Phase63 workflow for this one implementation PR.
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, LabDebug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run complete JVM regression
        run: gradle --no-daemon :app:test${{ matrix.variant }}UnitTest --stacktrace
      - name: Upload complete JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase61-62-r1-full-jvm-${{ matrix.variant }}-${{ github.sha }}
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  # The old required check stays fail-closed over both unchanged full suites.
  full-jvm:
    if: always() && (github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete')
    needs: full-jvm-variant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both full JVM variants
        env:
          VARIANTS_RESULT: ${{ needs.full-jvm-variant.result }}
        run: test "$VARIANTS_RESULT" = success

  android-contract:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install native Android build dependencies
        run: sudo apt-get update && sudo apt-get install -y glslc spirv-headers ninja-build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Phase61-62 contract smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_phase61_62_android_acceptance.sh
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase61-62-r1-android-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/r1-android-evidence/**
          if-no-files-found: warn
          retention-days: 14

  release-isolation:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Verify development and publication workflow separation
        run: python3 tools/validate_release_workflows.py
      - name: Create ephemeral signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/rpgos-r1-isolation.jks" \
            -storepass rpgos-ci-only -keypass rpgos-ci-only -alias rpgos \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=RPG OS R1 CI"
          echo "RPGOS_KEYSTORE_PATH=$RUNNER_TEMP/rpgos-r1-isolation.jks" >> "$GITHUB_ENV"
          echo "RPGOS_KEYSTORE_PASSWORD=rpgos-ci-only" >> "$GITHUB_ENV"
          echo "RPGOS_KEY_PASSWORD=rpgos-ci-only" >> "$GITHUB_ENV"
      - name: Install native Android build dependencies
        run: sudo apt-get update && sudo apt-get install -y glslc spirv-headers ninja-build
      - name: Build release variant for isolation inspection only
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify LAB components are absent from release
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          manifest="$(apkanalyzer manifest print "$apk")"
          packaged_names="$(unzip -Z1 "$apk")"
          dex_strings="$(unzip -p "$apk" 'classes*.dex' | strings)"
          for forbidden in RpgOsLabBridgeInitializer LabDiagnosticsActivity LabCodexProvider LAB_CODEX RPGOS_LAB_V1; do
            ! grep -Fq "$forbidden" <<<"$manifest"
            ! grep -Fq "$forbidden" <<<"$packaged_names"
            ! grep -Fq "$forbidden" <<<"$dex_strings"
          done
