name: GM141 Wire Diagnostics
on:
  push:
    branches:
      - gm-engine-141-foundation
    paths:
      - .github/workflows/gm141-wire-diagnostics.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gm-engine-141-foundation
      - run: python tools/gm141_wire_diagnostics.py
      - run: |
          grep -q 'fun loadGm141OfflineDiagnostics' app/src/main/java/com/rpgos/app/RpgOsViewModel.kt
          grep -q 'fun testGm141ProposalEndpoint' app/src/main/java/com/rpgos/app/RpgOsViewModel.kt
          grep -q 'Raport GM141 offline' app/src/main/java/com/rpgos/app/MainActivity.kt
          grep -q 'Test endpointu GM141 (bez zapisu)' app/src/main/java/com/rpgos/app/MainActivity.kt
          git config user.name rpg-os-ci
          git config user.email actions@users.noreply.github.com
          git add app/src/main/java/com/rpgos/app/RpgOsViewModel.kt app/src/main/java/com/rpgos/app/MainActivity.kt
          git diff --cached --check
          git commit -m 'GM Engine 141: expose safe diagnostics and proposal probe'
          git push origin HEAD:gm-engine-141-foundation
