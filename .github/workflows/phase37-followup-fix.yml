name: Phase37 Follow-up Fix

on:
  push:
    branches: ["chat3-phase37-post-audit-hardening"]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'trigger follow-up fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat3-phase37-post-audit-hardening
          fetch-depth: 0
      - run: git merge-base --is-ancestor 7d94c30ac47f23e44cbe7515a267512c3d6ad4de HEAD
      - run: python3 tools/phase37_followup_fix.py
      - run: git diff --check
      - name: Commit follow-up code/test correction
        run: |
          git config user.name "rpg-os-phase37-hardening-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt app/src/test/java/com/rpgos/app/Phase37WorldActorKnowledgeTest.kt
          git commit -m "fix(p37): complete hardening integration and corruption matrix"
          git push origin HEAD:chat3-phase37-post-audit-hardening
