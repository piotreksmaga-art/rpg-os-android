name: GM141 Validate
on:
  push:
    branches: [ "gm-engine-141-foundation" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GM141 backend syntax
        run: python -m py_compile backend/app.py backend/test_gm141_contract.py
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Test GM141 backend contract
        working-directory: backend
        run: pytest -q test_gm141_contract.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test GM Engine 141 invariants
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile GM Engine 141
        run: gradle --no-daemon :app:assembleDebug
