name: Phase63 Shared World Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: phase63-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  full-jvm:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, LabDebug]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTANCE_SHA }}
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$ACCEPTANCE_SHA"
      - name: Full JVM ${{ matrix.variant }}, including memory, Undo, NPC and world
        run: gradle --no-daemon :app:test${{ matrix.variant }}UnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase63-jvm-${{ matrix.variant }}-${{ env.ACCEPTANCE_SHA }}
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          retention-days: 14

  android-contract:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTANCE_SHA }}
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$ACCEPTANCE_SHA"
      - run: sudo apt-get update && sudo apt-get install -y glslc spirv-headers ninja-build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_phase63_android_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase63-android-${{ matrix.api-level }}-${{ env.ACCEPTANCE_SHA }}
          path: app/build/phase63-android-evidence/**
          retention-days: 14

  release-isolation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTANCE_SHA }}
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$ACCEPTANCE_SHA"
      - run: python3 tools/validate_release_workflows.py
      - name: Ephemeral inspection-only key, not the publication key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/phase63-isolation.jks" \
            -storepass rpgos-ci-only -keypass rpgos-ci-only -alias rpgos \
            -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=RPG OS Phase63 CI'
          echo "RPGOS_KEYSTORE_PATH=$RUNNER_TEMP/phase63-isolation.jks" >> "$GITHUB_ENV"
          echo 'RPGOS_KEYSTORE_PASSWORD=rpgos-ci-only' >> "$GITHUB_ENV"
          echo 'RPGOS_KEY_PASSWORD=rpgos-ci-only' >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y glslc spirv-headers ninja-build
      - run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Release contains no laboratory transport or provider
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          manifest="$(apkanalyzer manifest print "$apk")"
          packaged_names="$(unzip -Z1 "$apk")"
          dex_strings="$(unzip -p "$apk" 'classes*.dex' | strings)"
          for forbidden in RpgOsLabBridgeInitializer LabDiagnosticsActivity LabCodexProvider LAB_CODEX RPGOS_LAB_V1; do
            ! grep -Fq "$forbidden" <<<"$manifest"
            ! grep -Fq "$forbidden" <<<"$packaged_names"
            ! grep -Fq "$forbidden" <<<"$dex_strings"
          done
