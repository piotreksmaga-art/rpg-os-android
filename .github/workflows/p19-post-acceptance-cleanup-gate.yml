name: P19 Post-Acceptance Cleanup Gate

on:
  push:
    branches: [ "chat1/p19-post-acceptance-cleanup" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate release workflow separation
        run: python3 tools/validate_release_workflows.py
      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace
      - name: Canonical Phase 19 matrix
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.rpgos.app.Phase19CanonicalAuthorityTest \
            --tests com.rpgos.app.Phase19CanonicalCoherenceTest \
            --tests com.rpgos.app.Phase19CanonicalRollbackAuthorityTest \
            --tests com.rpgos.app.Phase19CanonicalProviderPolicyTest \
            --tests com.rpgos.app.Phase19CanonicalRegressionTest \
            --tests com.rpgos.app.WorldRuleProviderDeterminismRegressionTest \
            --stacktrace
      - name: Full JVM
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble validation
        run: gradle --no-daemon :app:assembleDebug --stacktrace
