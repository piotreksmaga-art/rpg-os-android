name: Phase38 Post-Audit Hardening Gate
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-post-audit-hardening
          fetch-depth: 0
      - name: Verify audited base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6628920ab78e1f2451be63e8e11e6e9e7f4e2b3 HEAD
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Temporary wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Materialize and publish immutable hardening candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rpg-os-phase38-ci"
          git config user.email "actions@users.noreply.github.com"
          if test -f app/src/test/java/com/rpgos/app/Phase38PostAuditHardeningTest.kt; then
            sha=$(git rev-parse HEAD)
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "HARDENING_CANDIDATE_SHA=$sha"
          else
            python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/phase38_post_audit_hardening.py")
          s = path.read_text()
          start = s.index('perception_path="app/src/main/java/com/rpgos/app/Phase38PerceptionDisclosure.kt"')
          end = s.index('# Update Slice-D fixture helpers to use runtime-issued objects.', start)
          replacement = r"""perception_path="app/src/main/java/com/rpgos/app/Phase38PerceptionDisclosure.kt"
          s=text(perception_path)
          s=s.replace("data class PerceptionSignal(\n", "class PerceptionSignal private constructor(\n",1)
          old='''        presentedSubject?.let { require(it.campaignUid == campaignUid) }
              }
          }
          '''
          new='''        presentedSubject?.let { require(it.campaignUid == campaignUid) }
              }
              companion object {
                  internal fun issue(
                      campaignUid:String, ref:PerceptionSignalRef, signalKindUid:String, quality:Double,
                      evidence:Map<String,Any?>, uncertainty:PerceptionUncertainty,
                      presentedSubject:VisibilitySubjectRef?, observationMetadata:Map<String,String>
                  ) = PerceptionSignal(campaignUid,ref,signalKindUid,quality,evidence,uncertainty,presentedSubject,observationMetadata)
              }
          }
          '''
          if old not in s: raise SystemExit("PerceptionSignal end anchor missing")
          s=s.replace(old,new,1)
          s=s.replace("data class PerceptionCapability(\n", "class PerceptionCapability private constructor(\n",1)
          old='''    internal fun isWellFormed(): Boolean =
                  channelUids.isNotEmpty() && channelUids.none { it.isBlank() } &&
                      minimumDetectionQuality.isFinite() && minimumDetectionQuality in 0.0..1.0 &&
                      maximumDisclosure != DisclosureLevel.DENY
          }
          '''
          new='''    internal fun isWellFormed(): Boolean =
                  channelUids.isNotEmpty() && channelUids.none { it.isBlank() } &&
                      minimumDetectionQuality.isFinite() && minimumDetectionQuality in 0.0..1.0 &&
                      maximumDisclosure != DisclosureLevel.DENY
              companion object {
                  internal fun issue(
                      campaignUid:String, ref:PerceptionCapabilityRef, observer:VisibilityPrincipalRef,
                      channelUids:Set<String>, minimumDetectionQuality:Double, maximumDisclosure:DisclosureLevel
                  ) = PerceptionCapability(campaignUid,ref,observer,channelUids,minimumDetectionQuality,maximumDisclosure)
              }
          }
          
          /** Runtime-owned issuer. Callers can request observation but cannot manufacture signal/capability authority. */
          internal object Phase38PerceptionRuntimeAuthority {
              fun issueSignal(
                  campaignUid:String, ref:PerceptionSignalRef, signalKindUid:String, quality:Double,
                  evidence:Map<String,Any?>, uncertainty:PerceptionUncertainty,
                  presentedSubject:VisibilitySubjectRef?=null, observationMetadata:Map<String,String> = emptyMap()
              ):PerceptionSignal = PerceptionSignal.issue(
                  campaignUid,ref,signalKindUid,quality,evidence.toMap(),uncertainty,presentedSubject,observationMetadata.toMap()
              )
              fun issueCapability(
                  trusted:TrustedPrincipalContext, ref:PerceptionCapabilityRef, observer:VisibilityPrincipalRef,
                  channelUids:Set<String>, minimumDetectionQuality:Double, maximumDisclosure:DisclosureLevel
              ):PerceptionCapability {
                  require(ref.campaignUid==trusted.campaignUid&&observer==trusted.principal){"RPGOS-P38-PERCEPTION:CAPABILITY_AUTHORITY_MISMATCH"}
                  return PerceptionCapability.issue(trusted.campaignUid,ref,observer,channelUids.toSet(),minimumDetectionQuality,maximumDisclosure)
              }
          }
          '''
          if old not in s: raise SystemExit("PerceptionCapability end anchor missing")
          s=s.replace(old,new,1)
          s=s.replace("data class PerceptionContext(\n", "data class PerceptionContext internal constructor(\n",1)
          s=s.replace("class PerceptionResolver {\n", "class PerceptionResolver internal constructor() {\n",1)
          anchor="class PerceptionResolver internal constructor() {\n"
          gateway='''fun interface TrustedPerceptionSignalSource { fun signal(campaignUid:String,signalRef:PerceptionSignalRef):PerceptionSignal? }
          fun interface TrustedPerceptionCapabilitySource { fun capabilities(campaignUid:String,principal:VisibilityPrincipalRef):List<PerceptionCapability> }
          
          class PerceptionRuntimeGateway internal constructor(
              private val principalResolver:TrustedPrincipalResolver,
              private val signalSource:TrustedPerceptionSignalSource,
              private val capabilitySource:TrustedPerceptionCapabilitySource
          ){
              fun evaluate(audience:AudienceContext,signalRef:PerceptionSignalRef,rules:PerceptionWorldRules,interference:List<PerceptionInterference> = emptyList(),expertise:List<PerceptionExpertise> = emptyList()):PerceptionDecision{
                  if(audience.campaignUid!=signalRef.campaignUid)throw VisibilityAuthorityFailure.CrossCampaign()
                  val principal=requireNotNull(audience.principal){"RPGOS-P38-PERCEPTION:PRINCIPAL_REQUIRED"}
                  val trusted=principalResolver.resolve(audience)?:return PerceptionDecision(audience.campaignUid,principal,signalRef,null,PerceptionResultState.DENIED,"TRUSTED_OBSERVER_REQUIRED")
                  val signal=signalSource.signal(audience.campaignUid,signalRef)?:return PerceptionDecision(audience.campaignUid,principal,signalRef,null,PerceptionResultState.NO_DATA,"NO_SIGNAL")
                  val capabilities=capabilitySource.capabilities(audience.campaignUid,principal)
                  val context=PerceptionContext(audience.campaignUid,trusted,capabilities,rules,interference,expertise)
                  return PerceptionResolver().evaluate(PerceptionRequest(context,signal))
              }
          }
          
          '''
          if anchor not in s: raise SystemExit("PerceptionResolver anchor missing")
          s=s.replace(anchor,gateway+anchor,1)
          write(perception_path,s)
          
          """
          s = s[:start] + replacement + s[end:]
          s = s.replace(
              'val sig=Phase38PerceptionRuntimeAuthority.issueSignal("C",PerceptionSignalRef("C","SIG"),"K",1.0,mapOf("presence" to true))',
              'val sig=Phase38PerceptionRuntimeAuthority.issueSignal("C",PerceptionSignalRef("C","SIG"),"K",1.0,mapOf("presence" to true),PerceptionUncertainty(1.0,1.0,1.0))'
          )
          path.write_text(s)
          PY
            python3 tools/phase38_post_audit_hardening.py
            git diff --check
            changed=$(git diff --name-only)
            echo "$changed"
            if echo "$changed" | grep -E '^(docs/|.*ROADMAP|.*ARCHITECTURE)' ; then echo 'docs changed'; exit 1; fi
            if echo "$changed" | grep -E '^app/src/main/.*/Phase32' ; then echo 'Phase32 production changed'; exit 1; fi
            git add -- app/src/main/java app/src/test/java
            git diff --cached --check
            git commit -m "fix(p38): close post-audit integration findings"
            sha=$(git rev-parse HEAD)
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "HARDENING_CANDIDATE_SHA=$sha"
            git push origin HEAD:chat1-phase38-post-audit-hardening
          fi
      - name: Phase38 targeted
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace > /tmp/p38-targeted.log 2>&1
          rc=$?
          echo "TARGETED_RC=$rc TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
          print(f'P38_TARGETED tests={t} failures={f} skipped={s}');assert t and f==0
          PY
          else
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/p38-targeted.log | tail -n 400 || true
            tail -n 320 /tmp/p38-targeted.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.materialize.outputs.sha }}"
          exit "$rc"
      - name: Isolate targeted results
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: Full JVM
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace > /tmp/p38-full.log 2>&1
          rc=$?
          echo "FULL_RC=$rc TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
          print(f'P38_FULL tests={t} failures={f} skipped={s}');assert t and f==0
          PY
          else
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/p38-full.log | tail -n 500 || true
            tail -n 360 /tmp/p38-full.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.materialize.outputs.sha }}"
          exit "$rc"
      - name: Confirm immutable green
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.materialize.outputs.sha }}"
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
          echo "POST_AUDIT_GREEN_SHA=${{ steps.materialize.outputs.sha }}"