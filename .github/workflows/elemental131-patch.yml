name: Elemental 131 one-shot patch

on:
  push:
    branches: [ "elemental-131" ]
    paths:
      - "tools/elemental131_patch.py"
      - ".github/workflows/elemental131-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout elemental-131
        uses: actions/checkout@v4
        with:
          ref: elemental-131
          fetch-depth: 0

      - name: Apply Elemental 131 visual patch
        run: python3 tools/elemental131_patch.py

      - name: Verify scope markers
        shell: bash
        run: |
          grep -q 'Elemental 131: cinematic material pass' app/src/main/java/com/rpgos/app/MainActivity.kt
          grep -q 'versionCode = 131' app/build.gradle.kts
          grep -q 'versionName = "1.2.0-alpha5-elemental131"' app/build.gradle.kts
          test -f ELEMENTAL_131.md
          test -f ELEMENTAL_131_VALIDATION.json

      - name: Commit final 131 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Elemental 131: cinematic five-element renderer [skip ci]"
          git push origin HEAD:elemental-131
