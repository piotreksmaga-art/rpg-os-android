name: Phase55-59 Memory Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "codex/phase55-59-memory", "master" ]

permissions:
  contents: read

jobs:
  memory-and-undo:
    # Phase63 runs the complete shared memory/NPC/world gates once in its own workflow.
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run Phase55-59 and destructive Undo gates
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.rpgos.app.Phase55To57MemoryOwnersTest' \
            --tests 'com.rpgos.app.Phase55To58MemoryContractTest' \
            --tests 'com.rpgos.app.Phase58MemoryConsolidationTest' \
            --tests 'com.rpgos.app.Phase58MemoryConsolidationScaleTest' \
            --tests 'com.rpgos.app.Phase59CanonicalRegressionTest' \
            --tests 'com.rpgos.app.Phase59CanonicalRegressionPublicApiTest' \
            --tests 'com.rpgos.app.Phase59CanonicalRehydrationTest' \
            --tests 'com.rpgos.app.UnifiedGameRepositoryMemoryArtifactLookupTest' \
            --tests 'com.rpgos.app.DestructiveTurnUndoTest' \
            --tests 'com.rpgos.app.CampaignFrontendSafetyContractTest' \
            --tests 'com.rpgos.app.Phase59LifecycleRegressionTest' \
            --tests 'com.rpgos.app.SemanticSidecarConstructorLockContractTest' \
            --tests 'com.rpgos.app.Phase32RepositoryWideWriterSourceInventoryTest' \
            --tests 'com.rpgos.app.Phase36SchemaVersioningTest' \
            --tests 'com.rpgos.app.BekkoSemanticMemoryTest' \
            --stacktrace
      - name: Compile Android device acceptance suites
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin --stacktrace

  full-jvm-variant:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Preserve all tests. A full single variant already takes about 32 minutes;
    # separate workers keep both suites within the existing job budget.
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, LabDebug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run complete JVM regression
        run: gradle --no-daemon :app:test${{ matrix.variant }}UnitTest --stacktrace
      - name: Upload complete JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase55-59-full-jvm-${{ matrix.variant }}-${{ github.sha }}
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  # Keep the existing required check identity, and fail on timeout, cancellation,
  # failure or a missing variant. This is not a waiver of historical coverage.
  full-jvm:
    if: always() && (github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete')
    needs: full-jvm-variant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both full JVM variants
        env:
          VARIANTS_RESULT: ${{ needs.full-jvm-variant.result }}
        run: test "$VARIANTS_RESULT" = success

  device-apks:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: sudo apt-get update && sudo apt-get install -y glslc spirv-headers ninja-build
      - name: Build device APKs once for both APIs and partitions
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PrpgosEmulatorX86=true --stacktrace
      - name: Bind APK artifacts to exact source and bytes
        shell: bash
        run: |
          cd app/build/outputs/apk
          printf '%s\n' '${{ github.sha }}' > acceptance-source-sha.txt
          sha256sum debug/app-debug.apk androidTest/debug/app-debug-androidTest.apk > acceptance-apks.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: phase55-59-device-apks-${{ github.sha }}
          path: app/build/outputs/apk/
          if-no-files-found: error
          retention-days: 14

  android-acceptance:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    # A failed/missing original short case must block the existing acceptance
    # check, not leave a misleading green 100-turn-only required status.
    needs: [device-apks, android-device-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: phase55-59-device-apks-${{ github.sha }}
          path: app/build/outputs/apk/
      - name: Verify source and checksums before installation
        shell: bash
        run: |
          read -r acceptance_source < app/build/outputs/apk/acceptance-source-sha.txt
          test "$acceptance_source" = '${{ github.sha }}'
          cd app/build/outputs/apk
          sha256sum -c acceptance-apks.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the complete 100-turn acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-memory-device-acceptance.sh hundred
      - name: Upload device acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase55-59-device-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14

  android-device-contract:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    needs: device-apks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: phase55-59-device-apks-${{ github.sha }}
          path: app/build/outputs/apk/
      - name: Verify source and checksums before installation
        shell: bash
        run: |
          read -r acceptance_source < app/build/outputs/apk/acceptance-source-sha.txt
          test "$acceptance_source" = '${{ github.sha }}'
          cd app/build/outputs/apk
          sha256sum -c acceptance-apks.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the other two original device cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-memory-device-acceptance.sh contracts
      - name: Upload device contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase55-59-device-contract-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14

  release-isolation:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/phase63-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Verify development and publication workflow separation
        run: python3 tools/validate_release_workflows.py
      - name: Create ephemeral signing key for isolation-only APK
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/rpgos-ci-isolation.jks" \
            -storepass rpgos-ci-only -keypass rpgos-ci-only -alias rpgos \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=RPG OS CI Isolation"
          echo "RPGOS_KEYSTORE_PATH=$RUNNER_TEMP/rpgos-ci-isolation.jks" >> "$GITHUB_ENV"
          echo "RPGOS_KEYSTORE_PASSWORD=rpgos-ci-only" >> "$GITHUB_ENV"
          echo "RPGOS_KEY_PASSWORD=rpgos-ci-only" >> "$GITHUB_ENV"
      - name: Build release variant for isolation inspection only
        run: sudo apt-get update && sudo apt-get install -y glslc spirv-headers ninja-build
      - name: Build release variant for isolation inspection only
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify LAB components are absent from manifest, DEX and packaged assets
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          manifest="$(apkanalyzer manifest print "$apk")"
          packaged_names="$(unzip -Z1 "$apk")"
          dex_strings="$(unzip -p "$apk" 'classes*.dex' | strings)"
          for forbidden in RpgOsLabBridgeInitializer LabDiagnosticsActivity LabCodexProvider LAB_CODEX RPGOS_LAB_V1; do
            ! grep -Fq "$forbidden" <<<"$manifest"
            ! grep -Fq "$forbidden" <<<"$packaged_names"
            ! grep -Fq "$forbidden" <<<"$dex_strings"
          done
