name: Active Player Control Docs Update

on:
  push:
    branches: ["docs-active-player-control-invariant"]

permissions:
  contents: write

jobs:
  update-docs:
    if: contains(github.event.head_commit.message, 'temporary active-player control docs patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-active-player-control-invariant
          fetch-depth: 0
      - name: Apply documentation update
        run: python3 tools/apply_active_player_control_docs.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- "docs/Architektura projektu.md" "docs/Roadmap.md"
      - name: Commit documentation
        run: |
          git config user.name "rpg-os-docs-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- "docs/Architektura projektu.md" "docs/Roadmap.md"
          git commit -m "docs: make active player control user-exclusive"
          git push origin HEAD:docs-active-player-control-invariant
