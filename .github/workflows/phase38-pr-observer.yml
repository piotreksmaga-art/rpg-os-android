name: Phase38 PR Validation Observer

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - name: Apply existing Slice A+B integration patch
        run: python3 tools/phase38_apply_slice_ab_patch.py
      - name: Migrate legacy protected-read tests
        run: python3 tools/phase38_migrate_legacy_context_tests.py
      - name: Apply final blocker closure
        run: python3 tools/phase38_final_closure_patch.py
      - name: Diff hygiene
        run: git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Temporary Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Targeted Phase38 A+B
        id: targeted
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace
      - name: Targeted summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests=fail=skip=0; failures=[]
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(f).getroot();tests+=int(r.attrib.get('tests',0));fail+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));skip+=int(r.attrib.get('skipped',0))
              for tc in r.findall('testcase'):
                  bad=tc.find('failure') or tc.find('error')
                  if bad is not None: failures.append(f"{tc.attrib.get('classname')}::{tc.attrib.get('name')} => {bad.attrib.get('message','')}")
          print(f'TARGETED_SUMMARY tests={tests} failures={fail} skipped={skip}')
          for item in failures: print('TARGETED_FAILURE '+item)
          if fail: raise SystemExit(1)
          PY
      - name: Verify targeted Gradle result
        run: test "${{ steps.targeted.outcome }}" = "success"
      - name: Full JVM
        id: full
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Full JVM summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests=fail=skip=0; failures=[]
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(f).getroot();tests+=int(r.attrib.get('tests',0));fail+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));skip+=int(r.attrib.get('skipped',0))
              for tc in r.findall('testcase'):
                  bad=tc.find('failure') or tc.find('error')
                  if bad is not None: failures.append(f"{tc.attrib.get('classname')}::{tc.attrib.get('name')} => {bad.attrib.get('message','')}")
          print(f'FULL_JVM_SUMMARY tests={tests} failures={fail} skipped={skip}')
          for item in failures: print('FULL_JVM_FAILURE '+item)
          if fail: raise SystemExit(1)
          PY
      - name: Verify full Gradle result
        run: test "${{ steps.full.outcome }}" = "success"
      - name: Wrapper is temporary
        if: always()
        run: |
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
