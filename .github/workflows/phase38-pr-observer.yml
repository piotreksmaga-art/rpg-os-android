name: Phase38 PR Validation Observer

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - run: python3 tools/phase38_apply_slice_ab_patch.py
      - run: python3 tools/phase38_migrate_legacy_context_tests.py
      - run: python3 tools/phase38_patch_anchor_fix.py
      - run: python3 tools/phase38_final_closure_patch.py
      - run: python3 tools/phase38_final_closure_fix2.py
      - run: git diff --check
      - name: Create immutable code-bearing commit before tests
        id: code_sha
        run: |
          git config user.name "rpg-os-phase38-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java app/src/test/java backend/app.py
          git diff --cached --check
          git commit -m "feat(p38): close Slice A+B protected visual and read boundaries"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "GREEN_CANDIDATE_TESTED_SHA=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain -- app/src/main/java app/src/test/java backend/app.py)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Temporary Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Clear targeted results
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: Targeted Phase38 A+B
        id: targeted
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace
      - name: Targeted summary
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests=fail=skip=0
          files=glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          assert files, 'no targeted JUnit XML'
          for f in files:
              r=ET.parse(f).getroot();tests+=int(r.attrib.get('tests',0));fail+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));skip+=int(r.attrib.get('skipped',0))
          print(f'TARGETED_SUMMARY tests={tests} failures={fail} skipped={skip}')
          if fail: raise SystemExit(1)
          PY
          echo "TARGETED_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ steps.code_sha.outputs.sha }}"
      - name: Clear targeted XML before full JVM
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: Full JVM
        id: full
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Full JVM summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests=fail=skip=0; failures=[]
          files=glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          assert files, 'no full JVM JUnit XML'
          for f in files:
              r=ET.parse(f).getroot();tests+=int(r.attrib.get('tests',0));fail+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));skip+=int(r.attrib.get('skipped',0))
              for tc in r.findall('testcase'):
                  bad=tc.find('failure')
                  if bad is None: bad=tc.find('error')
                  if bad is not None: failures.append(f"{tc.attrib.get('classname')}::{tc.attrib.get('name')} => {bad.attrib.get('message','')}")
          print(f'FULL_JVM_SUMMARY tests={tests} failures={fail} skipped={skip}')
          for item in failures: print('FULL_JVM_FAILURE '+item)
          if fail: raise SystemExit(1)
          PY
          echo "FULL_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ steps.code_sha.outputs.sha }}"
          test "${{ steps.full.outcome }}" = "success"
      - name: Remove wrapper and verify code tree unchanged
        run: |
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          test "$(git rev-parse HEAD)" = "${{ steps.code_sha.outputs.sha }}"
          test -z "$(git status --porcelain -- app/src/main/java app/src/test/java backend/app.py)"
      - name: Push exact tested code-bearing commit
        run: git push origin HEAD:chat1-phase38-slice-ab-protected-read
