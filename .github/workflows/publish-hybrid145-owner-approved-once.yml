name: Publish hybrid145 owner-approved one-time

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  actions: read

env:
  ACCEPTED_SHA: 97d560b955cffd132f03ef79f106ac8a05c0f64a
  VALIDATION_RUN_ID: "31953200345"
  VALIDATION_ARTIFACT_ID: "9265286704"
  VERSION_NAME: 1.2.0-alpha5-hybrid145
  VERSION_CODE: "145"
  EXPECTED_APK_SHA256: 037f171e26de4cc4fd9ebd1b6c88279623a6a49362808a9d1d4c5e7c3ec2a098

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify this commit is only the owner-authorized release trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify trigger ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$ACCEPTED_SHA" || { echo "::error::trigger parent=$PARENT expected=$ACCEPTED_SHA"; exit 1; }
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          test "$CHANGED" = ".github/workflows/publish-hybrid145-owner-approved-once.yml" || { echo "::error::unexpected trigger diff: $CHANGED"; exit 1; }
      - name: Verify exact validated immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_SHA=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$VALIDATION_RUN_ID --jq '.head_sha')
          RUN_STATUS=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$VALIDATION_RUN_ID --jq '.status')
          RUN_CONCLUSION=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$VALIDATION_RUN_ID --jq '.conclusion')
          ART_SHA=$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/$VALIDATION_ARTIFACT_ID --jq '.workflow_run.head_sha')
          ART_EXPIRED=$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/$VALIDATION_ARTIFACT_ID --jq '.expired')
          test "$RUN_SHA" = "$ACCEPTED_SHA"
          test "$RUN_STATUS" = "completed"
          test "$RUN_CONCLUSION" = "success"
          test "$ART_SHA" = "$ACCEPTED_SHA"
          test "$ART_EXPIRED" = "false"
          if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then echo "::error::release already exists"; exit 1; fi
      - name: Download and verify exact validated APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir validated
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATION_ARTIFACT_ID}/zip" -o validated.zip
          unzip -q validated.zip -d validated
          APK=$(find validated -type f -name '*.apk' -print -quit)
          test -n "$APK"
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_APK_SHA256" || { echo "::error::APK SHA=$ACTUAL expected=$EXPECTED_APK_SHA256"; exit 1; }
          PROV=$(find validated -type f -name 'build-provenance.json' -print -quit)
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["head_sha"]==sys.argv[2]; assert str(d["workflow_run_id"])==sys.argv[3]; assert d["apk_sha256"]==sys.argv[4]' "$PROV" "$ACCEPTED_SHA" "$VALIDATION_RUN_ID" "$EXPECTED_APK_SHA256"
          cp "$APK" "RPG-OS-ALPHA-$VERSION_NAME.apk"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "RPG-OS-ALPHA-$VERSION_NAME.apk" > "RPG-OS-ALPHA-$VERSION_NAME.apk.sha256"
          printf '{\n  "schema": 1,\n  "version_name": "%s",\n  "version_code": %s,\n  "sha256": "%s",\n  "mandatory": false,\n  "accepted_sha": "%s",\n  "validation_run_id": %s,\n  "notes": "RPG OS — cumulative accepted implementation through Phase 19"\n}\n' "$VERSION_NAME" "$VERSION_CODE" "$EXPECTED_APK_SHA256" "$ACCEPTED_SHA" "$VALIDATION_RUN_ID" > update.json
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$TAG" -f sha="$ACCEPTED_SHA" >/dev/null
          gh release create "$TAG" "RPG-OS-ALPHA-$VERSION_NAME.apk" "RPG-OS-ALPHA-$VERSION_NAME.apk.sha256" update.json --verify-tag --title "RPG OS ALPHA $VERSION_NAME" --notes "RPG OS — cumulative accepted implementation through Phase 19. Publication explicitly authorized by the project owner. Accepted candidate: $ACCEPTED_SHA. Validation run: $VALIDATION_RUN_ID. Phase 20 is NOT STARTED."
      - name: Verify published APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v$VERSION_NAME --jq '.object.sha')
          test "$TAG_SHA" = "$ACCEPTED_SHA"
          mkdir published
          gh release download "v$VERSION_NAME" -p "RPG-OS-ALPHA-$VERSION_NAME.apk" -D published
          PUBLISHED_SHA=$(sha256sum "published/RPG-OS-ALPHA-$VERSION_NAME.apk" | awk '{print $1}')
          test "$PUBLISHED_SHA" = "$EXPECTED_APK_SHA256"
          echo "PUBLISHED_APK_SHA256=$PUBLISHED_SHA"
