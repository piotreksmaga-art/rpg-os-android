name: TEMP archive canonical docs

on:
  push:
    branches:
      - docs-future-architecture-hybrid-living-world
    paths:
      - .github/workflows/temp-history-archive.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-future-architecture-hybrid-living-world
          fetch-depth: 0
      - name: Create exact documentation archive
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Historia projektu\n\n'
            printf 'Status: ARCHIWUM / HISTORYCZNE ŹRÓDŁO ODNIESIENIA\n\n'
            printf '> Snapshot utworzony przed normalizacją aktywnych dokumentów. Poniżej znajduje się pełna, niezmieniona treść `docs/Architektura projektu.md` oraz `docs/Roadmap.md` z brancha `docs-future-architecture-hybrid-living-world` przed ich odchudzeniem.\n\n'
            printf '---\n\n# SNAPSHOT: docs/Architektura projektu.md\n\n'
            cat 'docs/Architektura projektu.md'
            printf '\n\n---\n\n# SNAPSHOT: docs/Roadmap.md\n\n'
            cat 'docs/Roadmap.md'
            printf '\n'
          } > 'docs/Historia projektu.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/Historia projektu.md'
          git commit -m 'docs: archive full architecture and roadmap history'
          git push origin HEAD:docs-future-architecture-hybrid-living-world
