name: CHAT-6 TEMP GM Validation
on:
  push:
    branches: [ "chat6-temp-gm-android-ui" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble TEST APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Evidence
        run: |
          mkdir -p chat6-evidence
          cp app/build/outputs/apk/debug/app-debug.apk chat6-evidence/RPG-OS-TEMP-GM-TEST.apk
          sha256sum chat6-evidence/RPG-OS-TEMP-GM-TEST.apk > chat6-evidence/RPG-OS-TEMP-GM-TEST.apk.sha256
          printf '{"head_sha":"%s","publication":false}\n' "$GITHUB_SHA" > chat6-evidence/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: CHAT6-TEMP-GM-TEST-${{ github.sha }}
          path: chat6-evidence/
          retention-days: 14
