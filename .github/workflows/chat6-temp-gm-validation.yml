name: CHAT-6 TEMP GM Validation
on:
  push:
    branches: [ "chat6-temp-gm-android-ui" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.RPGOS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RPGOS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RPGOS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing RPG OS signing secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rpgos-release.jks"
          chmod 600 "$RUNNER_TEMP/rpgos-release.jks"
          echo "RPGOS_KEYSTORE_PATH=$RUNNER_TEMP/rpgos-release.jks" >> "$GITHUB_ENV"
          echo "RPGOS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RPGOS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble signed release-mode TEST APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify identity and canonical signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chat6-evidence
          APK=app/build/outputs/apk/release/app-release.apk
          OUT=chat6-evidence/RPG-OS-TEMP-GM-SIGNED-TEST-143.apk
          cp "$APK" "$OUT"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$OUT" | tee chat6-evidence/temp143-apksigner.txt
          "$AAPT" dump badging "$OUT" | head -n 1 | tee chat6-evidence/temp143-package.txt
          grep -q "package: name='com.rpgos.app' versionCode='143' versionName='1.2.0-alpha5-temp-gm143'" chat6-evidence/temp143-package.txt
          TEMP_CERT=$("$APKSIGNER" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$TEMP_CERT"
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/hybrid142.apk" \
            "https://github.com/piotreksmaga-art/rpg-os-android/releases/download/v1.2.0-alpha5-hybrid142/RPG-OS-ALPHA-1.2.0-alpha5-hybrid142.apk"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/hybrid142.apk" | tee chat6-evidence/hybrid142-apksigner.txt
          HYBRID_CERT=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/hybrid142.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$HYBRID_CERT"
          printf 'HYBRID142_CERT_SHA256=%s\nTEMP143_CERT_SHA256=%s\n' "$HYBRID_CERT" "$TEMP_CERT" | tee chat6-evidence/certificate-comparison.txt
          test "$HYBRID_CERT" = "$TEMP_CERT"
          printf 'CERTIFICATE_MATCH=PASS\n' >> chat6-evidence/certificate-comparison.txt
          sha256sum "$OUT" > chat6-evidence/RPG-OS-TEMP-GM-SIGNED-TEST-143.apk.sha256
          printf '{"head_sha":"%s","version_code":143,"version_name":"1.2.0-alpha5-temp-gm143","package":"com.rpgos.app","build_type":"release-mode validation artifact","canonical_signing":true,"publication":false}\n' "$GITHUB_SHA" > chat6-evidence/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: CHAT6-TEMP-GM-SIGNED-TEST-143-${{ github.sha }}
          path: chat6-evidence/
          if-no-files-found: error
          retention-days: 14
