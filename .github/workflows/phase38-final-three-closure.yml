name: Phase38 Final Three-Finding Closure Gate
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-final-three-finding-closure
          fetch-depth: 0
      - name: Verify closure input and master anchor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1a4197648b98abdc2d4dd7b7441123ed0ddfc62f HEAD
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Temporary wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Materialize finding-001 candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rpg-os-phase38-ci"
          git config user.email "actions@users.noreply.github.com"
          if grep -q 'worldActorPerceptionRuntime: Phase38WorldActorPerceptionRuntime' app/src/main/java/com/rpgos/app/ContextBuilder.kt; then
            sha=$(git rev-parse HEAD)
          else
            python3 tools/phase38_final_three_closure.py
            git diff --check
            changed=$(git diff --name-only)
            echo "$changed"
            if echo "$changed" | grep -E '^(docs/|.*ROADMAP|.*ARCHITECTURE|backend/)' ; then echo 'forbidden closure change'; exit 1; fi
            git add -- app/src/main/java app/src/test/java
            git diff --cached --check
            git commit -m "fix(p38): require trusted perception for world actors"
            sha=$(git rev-parse HEAD)
            git push origin HEAD:chat1-phase38-final-three-finding-closure
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "P38_FINDING001_SHA=$sha"
      - name: Phase38 targeted
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace > /tmp/p38-targeted.log 2>&1
          rc=$?
          echo "TARGETED_RC=$rc TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot();t+=int(r.attrib.get('tests',0));f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0));s+=int(r.attrib.get('skipped',0))
          print(f'P38_TARGETED tests={t} failures={f} skipped={s}');assert t and f==0
          PY
          else
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/p38-targeted.log | tail -n 500 || true
            tail -n 360 /tmp/p38-targeted.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.materialize.outputs.sha }}"
          exit "$rc"
      - name: Confirm immutable targeted candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.materialize.outputs.sha }}"
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
          echo "P38_FINDING001_TARGETED_GREEN_SHA=${{ steps.materialize.outputs.sha }}"
