name: Phase48-54 Final Validation

on:
  workflow_dispatch:
  push:
    branches: [ "codex/phase-48-54-final" ]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run Phase48-54 and Director suites
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.rpgos.app.Phase43To54VerticalSliceTest' \
            --tests 'com.rpgos.app.Phase48To54FinalPlanTest' \
            --stacktrace

  full-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Record exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run full JVM regression
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
