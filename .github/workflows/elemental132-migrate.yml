name: Elemental 132 asset migration

on:
  push:
    branches: [ "elemental-132" ]
    paths:
      - ".github/workflows/elemental132-migrate.yml"

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout elemental-132
        uses: actions/checkout@v4
        with:
          ref: elemental-132

      - name: Generate VFX assets and patch source
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/elemental132_asset_migration.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate Elemental 132 scope
        shell: bash
        run: |
          grep -q 'versionCode = 132' app/build.gradle.kts
          grep -q 'elemental132' app/build.gradle.kts
          grep -q 'R.drawable.elemental_wind_132' app/src/main/java/com/rpgos/app/MainActivity.kt
          test -f app/src/main/res/drawable-nodpi/elemental_wind_132.png
          test -f app/src/main/res/drawable-nodpi/elemental_fire_132.png
          test -f app/src/main/res/drawable-nodpi/elemental_water_132.png
          test -f app/src/main/res/drawable-nodpi/elemental_earth_132.png
          test -f app/src/main/res/drawable-nodpi/elemental_lightning_132.png

      - name: Compile Elemental 132 debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit final 132 source and assets
        shell: bash
        run: |
          rm -f tools/elemental132_asset_migration.py .github/workflows/elemental132-migrate.yml
          git config user.name "piotreksmaga-art"
          git config user.email "piotreksmaga@gmail.com"
          git add -A
          git commit -m "Elemental 132: switch five elements to raster VFX assets"
          git push origin HEAD:elemental-132
