name: Phase 19 unbound mode compile fix
on:
  push:
    branches: [ master ]
    paths:
      - scripts/phase19_unbound_mode_fix.py
      - .github/workflows/phase19-unbound-mode-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - run: python3 scripts/phase19_unbound_mode_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/WorldRuleProvider.kt \
                  app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19Test.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19BlockerReproductionTest.kt \
                  app/src/test/java/com/rpgos/app/WorldRuleProviderPhase19HardeningTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep generic world-rule mode Core-internal"
          git push origin HEAD:master
