name: P19 Fix Race Fixture
on:
  push:
    branches: [agent/p19-writer-crash-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p19-writer-crash-hardening
      - shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/test/java/com/rpgos/app/Phase19WriterCrashRecoveryHardeningTest.kt')
          s = p.read_text()
          pattern = r'''    private fun bootstrapRace\(relative: String, required: String, isCampaign: Boolean\) \{.*?\n    \}\n\n    private fun validWorldPack'''
          replacement = '''    private fun bootstrapRace(relative: String, required: String, isCampaign: Boolean) {
              val app = cleanApp()
              val root = File(app.filesDir, "rpgos")
              val target = File(root, relative)
              target.parentFile?.mkdirs()
              val stale = File(target.parentFile, ".${target.name}.prepared-stale")
              if (isCampaign) campaign(stale, "BUNDLED", "1") else worldPack(stale, "BUNDLED", "1")
              val validPackage: (File) -> Boolean = { candidate -> File(candidate, required).isFile }

              CanonicalPackageAuthorityGate.mutate {
                  if (isCampaign) campaign(target, "FRESH", "99") else worldPack(target, "FRESH", "99")
                  File(target, "fresh-marker").writeText("FRESH")
              }

              val activated = CanonicalPackageReplacement.activatePreparedIf(
                  prepared = stale,
                  target = target,
                  isValidPackage = validPackage,
                  shouldActivate = { !File(target, required).isFile }
              )
              assertFalse("stale bootstrap intent must be rejected", activated)
              assertTrue("fresh canonical writer must win stale bootstrap intent", File(target, "fresh-marker").isFile)
              assertTrue(File(target, required).isFile)
          }

          private fun validWorldPack'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, n
          p.write_text(s)
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test/java/com/rpgos/app/Phase19WriterCrashRecoveryHardeningTest.kt
          git commit -m "test: make bootstrap stale-intent race deterministic"
          git push origin HEAD:agent/p19-writer-crash-hardening
