name: Finalize Phase35-36 docs
on:
  push:
    branches: [docs-update-phase35-36-final]
permissions:
  contents: write
jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update roadmap and file map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/Roadmap.md')
          s = roadmap.read_text()
          marker = "Operational protocol: `docs/PROJECT_WORK_PROTOCOL.md`\n"
          note = "\n> Aktualizacja 2026-08-20: Phase 35–36 post-audit repair została scalona do `master` i ponownie zweryfikowana na canonical master SHA `4d5a114fc9f08141d75ae79f998a3400866b52ba`. Finalna walidacja `Validate RPG OS ALPHA` / run #801 / run ID `32309493128` — SUCCESS. Repair domknął P35-AUD-001..003 oraz P36-AUD-001..006, w tym runtime-only Canon Divergence authority, autentykację World Pack/expected/actual, lifecycle divergence, migrację Event v1→v2 wewnątrz durable Phase-36 attempt, version-edge graph, wspólną recoverable-snapshot policy, lifecycle serialization i immutable migration implementation identity. Następny blok pozostaje Phase 37 — NPC Knowledge model + acquisition provenance, AUDIT FIRST.\n"
          if note.strip() not in s:
              s = s.replace(marker, marker + note, 1)
          s = s.replace("- Canonical accepted runtime through Phase 36: `7cb61d3cdc42e0c20f2688181d054e55eacbfd8f`.\n- Exact acceptance CI: workflow `Validate RPG OS ALPHA`, run ID `32241299329` / job `96032227097` — SUCCESS.\n", "- Canonical accepted runtime through Phase 36: `4d5a114fc9f08141d75ae79f998a3400866b52ba`.\n- Final post-audit exact-master acceptance CI: workflow `Validate RPG OS ALPHA`, run #801 / run ID `32309493128` — SUCCESS.\n- Earlier Phase 35–36 acceptance evidence remains preserved below for audit history.\n", 1)
          s = s.replace("Runtime through Phase 36 jest globalnie **ACCEPTED / COMPLETE** na exact runtime SHA `7cb61d3cdc42e0c20f2688181d054e55eacbfd8f`.", "Runtime through Phase 36 jest globalnie **ACCEPTED / COMPLETE** na canonical post-audit master SHA `4d5a114fc9f08141d75ae79f998a3400866b52ba` (`Validate RPG OS ALPHA` run #801 / `32309493128` — SUCCESS).", 1)
          anchor = "Exact-SHA JVM tests, signed APK and immutable artifact are GREEN. Superseded PR #51 was closed without merge. Canonical acceptance record: `docs/architecture/PHASE35_36_ACCEPTANCE.md`."
          extra = anchor + "\n\nPost-audit re-acceptance: Phase 35 findings P35-AUD-001..003 and Phase 36 findings P36-AUD-001..006 were repaired, independently reviewed/validated, merged to `master`, and canonical master validation passed at `4d5a114fc9f08141d75ae79f998a3400866b52ba` (`Validate RPG OS ALPHA` run #801 / run ID `32309493128`). This supersedes the earlier runtime as the current accepted Phase-36 baseline without erasing historical acceptance evidence."
          if "Post-audit re-acceptance: Phase 35 findings" not in s:
              s = s.replace(anchor, extra, 1)
          roadmap.write_text(s)

          fmap = Path('docs/Mapa plików.md')
          m = fmap.read_text()
          def add_after(text, addition):
              global m
              if addition.strip() not in m:
                  m = m.replace(text, text + addition, 1)

          add_after("- PRIMARY: `app/src/main/java/com/rpgos/app/Phase35CanonDivergence.kt`\n", "- SUPPORTING: `app/src/main/java/com/rpgos/app/GameplayMutationGate.kt`\n- SUPPORTING: `app/src/main/java/com/rpgos/app/CampaignMutationBoundary.kt`\n")
          add_after("- TEST: `app/src/test/java/com/rpgos/app/Phase35CanonDivergenceTest.kt`\n", "- TEST: `app/src/test/java/com/rpgos/app/Phase35PostAuditRepairTest.kt`\n- TEST: `app/src/test/java/com/rpgos/app/Phase35RawSqlAuthorityClosureTest.kt`\n")
          add_after("- PRIMARY: `app/src/main/java/com/rpgos/app/Phase36SchemaCompatibilityFingerprint.kt`\n", "- PRIMARY: `app/src/main/java/com/rpgos/app/Phase36EventSchemaScaffold.kt`\n- PRIMARY: `app/src/main/java/com/rpgos/app/RecoverableSnapshotPolicy.kt`\n")
          add_after("- TEST: `app/src/test/java/com/rpgos/app/Phase36SchemaVersioningTest.kt`\n", "- TEST: `app/src/test/java/com/rpgos/app/Phase36PostAuditEdgeCaseTest.kt`\n")
          old = "- ARTIFACT: ID `9361064715`, SHA-256 `73da8802468e0302c5f4548bda9a2240d5c44a17ceed209b27e10c6e11f84b90`"
          finalnote = "\n- CURRENT POST-AUDIT MASTER: `4d5a114fc9f08141d75ae79f998a3400866b52ba`\n- FINAL MASTER CI: `Validate RPG OS ALPHA` run #801 / run ID `32309493128` — SUCCESS"
          # Add to both Phase35 and Phase36 occurrences of the historical artifact line.
          parts = m.split(old)
          if len(parts) >= 3 and "CURRENT POST-AUDIT MASTER" not in m:
              m = (old + finalnote).join(parts)
          fmap.write_text(m)
          PY
          rm -f .github/workflows/docs-phase35-36-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'docs/Roadmap.md' 'docs/Mapa plików.md' '.github/workflows/docs-phase35-36-finalize.yml'
          git diff --cached --check
          git commit -m 'docs: sync roadmap and file map after Phase 35-36 repairs'
          git push
