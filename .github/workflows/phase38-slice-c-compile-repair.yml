name: Phase38 Slice C Compile Repair
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  repair-c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase38-slice-ab-protected-read
          fetch-depth: 0
      - name: Verify repair base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c36b2245c7ccb6021a790d99bc6e9f42e8df33b0 HEAD
          test "$(git rev-parse origin/master)" = "e4b539fa87113c5ec46da2facf282c8004dc7e44"
          test -f app/src/main/java/com/rpgos/app/Phase38AccessAuthority.kt
          test -f tools/phase38_slice_c_compile_repair.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Temporary wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x ./gradlew
      - name: Apply and publish immutable compile repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rpg-os-phase38-ci"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/phase38_slice_c_compile_repair.py
          git diff --check
          changed=$(git diff --name-only -- app/src/main/java tools/phase38_integrated_fixups.py | sort)
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            app/src/main/java/com/rpgos/app/Phase38AccessAuthority.kt \
            app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt \
            app/src/main/java/com/rpgos/app/WorldRuleProvider.kt \
            tools/phase38_integrated_fixups.py | sort)
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- 'app/src/main/java/com/rpgos/app/Phase32*')"
          git add app/src/main/java/com/rpgos/app/Phase38AccessAuthority.kt \
                  app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt \
                  app/src/main/java/com/rpgos/app/WorldRuleProvider.kt \
                  tools/phase38_integrated_fixups.py
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- gradle gradlew gradlew.bat)"
          git commit -m "fix(p38): repair Slice C sealed payload integration"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SLICE_C_REPAIR_SHA=$sha"
          git push origin HEAD:chat1-phase38-slice-ab-protected-read
      - name: Repository-wide sealed payload switch search
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PlayerDomainChangePayload declaration/use sites ==='
          grep -RIl --include='*.kt' 'PlayerDomainChangePayload\|KnowledgeAcquisitionChange' app/src/main/java | sort
          echo '=== AccessAuthorityChange explicit handling sites ==='
          grep -RIl --include='*.kt' 'AccessAuthorityChange' app/src/main/java | sort
          grep -q 'is AccessAuthorityChange' app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt
          test "$(grep -c 'is AccessAuthorityChange' app/src/main/java/com/rpgos/app/WorldRuleProvider.kt)" -ge 2
          grep -q 'is AccessAuthorityChange' app/src/main/java/com/rpgos/app/TurnTransaction.kt
          test "$(git rev-parse HEAD)" = "${{ steps.repair.outputs.sha }}"
      - name: Targeted Phase38
        shell: bash
        run: |
          set +e
          rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase38*' --stacktrace > /tmp/c-targeted.log 2>&1
          rc=$?
          echo "TARGETED_RC=$rc"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print(f'TARGETED_SUMMARY tests={t} failures={f} skipped={s}'); assert t and f==0
          PY
          else
            echo '=== TARGETED ERRORS/FAILURES ==='
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/c-targeted.log | tail -n 400 || true
            echo '=== TARGETED LOG TAIL ==='
            tail -n 320 /tmp/c-targeted.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.repair.outputs.sha }}"
          exit "$rc"
      - name: Isolate targeted XML
        run: rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
      - name: Full JVM
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace > /tmp/c-full.log 2>&1
          rc=$?
          echo "FULL_RC=$rc"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(x).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0))+int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print(f'FULL_SUMMARY tests={t} failures={f} skipped={s}'); assert t and f==0
          PY
          else
            echo '=== FULL JVM ERRORS/FAILURES ==='
            grep -E '(^e: file:|FAILED|AssertionError|expected:|but was:|Compilation error|Unresolved reference|Cannot access|Type mismatch|There were failing tests|FAILURE: Build failed)' /tmp/c-full.log | tail -n 500 || true
            echo '=== FULL JVM LOG TAIL ==='
            tail -n 360 /tmp/c-full.log
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.repair.outputs.sha }}"
          exit "$rc"
      - name: Confirm Slice C green
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.repair.outputs.sha }}"
          echo "SLICE_C_GREEN_SHA=${{ steps.repair.outputs.sha }}"
