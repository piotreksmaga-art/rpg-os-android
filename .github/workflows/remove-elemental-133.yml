name: Remove Elemental 133

on:
  push:
    branches: [ "remove-elemental-133" ]

permissions:
  contents: write

jobs:
  remove-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-elemental-133
          fetch-depth: 0

      - name: Remove Elemental system
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/rpgos/app/MainActivity.kt')
          s = main.read_text()

          # Home no longer depends on visual-effect settings.
          s = s.replace('    val appSettings by vm.settings.collectAsState()\n\n', '')
          s = s.replace('            visualEffectsLevel = appSettings.visualEffectsLevel,\n            introAnimation = appSettings.introAnimation,\n', '')
          s = s.replace('    visualEffectsLevel: String,\n    introAnimation: Boolean,\n', '')
          s = re.sub(
              r'\s*ElementalSystemHeader\(\s*visualEffectsLevel = visualEffectsLevel,\s*introAnimation = introAnimation\s*\)',
              '\n                SystemHeader()', s, count=1
          )

          # Replace the complete Elemental header/orbit implementation with a static clean header.
          start = s.index('@Composable\nprivate fun ElementalSystemHeader(')
          end = s.index('@Composable\nprivate fun StatMini', start)
          clean_header = '''@Composable
private fun SystemHeader() {
    Box(
        modifier = Modifier
            .fillMaxWidth()
            .height(168.dp),
        contentAlignment = Alignment.Center
    ) {
        Column(horizontalAlignment = Alignment.CenterHorizontally) {
            Text(
                "SYSTEM",
                style = MaterialTheme.typography.labelLarge,
                color = Color(0xFF55D6FF).copy(alpha = 0.90f)
            )
            Text(
                "RPG OS",
                style = MaterialTheme.typography.displaySmall,
                fontWeight = FontWeight.Black,
                color = Color(0xFFD5F1FF)
            )
            Text(
                "Twoje kampanie. Jeden system.",
                style = MaterialTheme.typography.titleMedium,
                color = MaterialTheme.colorScheme.onSurfaceVariant
            )
        }
    }
}

'''
          s = s[:start] + clean_header + s[end:]

          # Settings local state for the retired visual system.
          s = re.sub(r'^\s*var effects by remember\(current\.visualEffectsLevel\).*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*var introAnimation by remember\(current\.introAnimation\).*\n', '', s, flags=re.M)

          def remove_enclosing_item(text: str, needle: str) -> str:
              pos = text.find(needle)
              if pos < 0:
                  return text
              starts = [text.rfind('item{', 0, pos), text.rfind('item {', 0, pos)]
              st = max(starts)
              if st < 0:
                  raise RuntimeError(f'Cannot find item start for {needle}')
              brace = text.find('{', st)
              depth = 0
              in_str = False
              esc = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if in_str:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == '"': in_str = False
                  else:
                      if ch == '"': in_str = True
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:st] + text[i+1:]
                  i += 1
              raise RuntimeError(f'Unbalanced item for {needle}')

          s = remove_enclosing_item(s, '"minimal" to "Minimalna"')
          s = remove_enclosing_item(s, 'Smok okrąża logo podczas uruchamiania.')

          # Saving settings no longer persists retired fields.
          s = re.sub(r',?\s*visualEffectsLevel=effects,\s*introAnimation=introAnimation', '', s)

          # Remove imports introduced only for the raster Elemental renderer.
          s = s.replace('import androidx.compose.foundation.Image\n', '')
          s = s.replace('import androidx.compose.ui.res.painterResource\n', '')

          main.write_text(s)

          settings = Path('app/src/main/java/com/rpgos/app/AppSettings.kt')
          a = settings.read_text()
          a = a.replace(',\n    val autoBackup: Boolean,\n    val visualEffectsLevel: String = "standard",\n    val introAnimation: Boolean = true\n', ',\n    val autoBackup: Boolean\n')
          a = a.replace('            autoBackup = prefs.getBoolean("auto_backup", true),\n            visualEffectsLevel = prefs.getString("visual_effects_level", "standard") ?: "standard",\n            introAnimation = prefs.getBoolean("intro_animation", true)\n', '            autoBackup = prefs.getBoolean("auto_backup", true)\n')
          a = a.replace('            .putBoolean("auto_backup", settings.autoBackup)\n            .putString("visual_effects_level", settings.visualEffectsLevel)\n            .putBoolean("intro_animation", settings.introAnimation)\n', '            .putBoolean("auto_backup", settings.autoBackup)\n')
          settings.write_text(a)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 132', 'versionCode = 133')
          g = g.replace('versionName = "1.2.0-alpha5-elemental132"', 'versionName = "1.2.0-alpha5-clean133"')
          gradle.write_text(g)
          PY

          rm -f app/src/main/res/drawable-nodpi/elemental_*_132.png
          rm -f ELEMENTAL_129.md ELEMENTAL_129_VALIDATION.json \
                ELEMENTAL_130.md ELEMENTAL_130_VALIDATION.json \
                ELEMENTAL_131.md ELEMENTAL_131_VALIDATION.json \
                ELEMENTAL_132.md

      - name: Verify no Elemental remnants
        shell: bash
        run: |
          ! grep -R -n -E 'ElementalOrbit|ElementalSystemHeader|elemental_[a-z]+_132|visualEffectsLevel|introAnimation|Smok okrąża logo' app/src/main app/build.gradle.kts
          test ! -e ELEMENTAL_129.md
          test ! -e ELEMENTAL_130.md
          test ! -e ELEMENTAL_131.md
          test ! -e ELEMENTAL_132.md
          grep -q 'versionCode = 133' app/build.gradle.kts
          grep -q 'versionName = "1.2.0-alpha5-clean133"' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile clean 133
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Commit clean source only
        shell: bash
        run: |
          git config user.name "piotreksmaga-art"
          git config user.email "piotreksmaga@gmail.com"
          git add app/src/main/java/com/rpgos/app/MainActivity.kt \
                  app/src/main/java/com/rpgos/app/AppSettings.kt \
                  app/build.gradle.kts
          git add -u app/src/main/res/drawable-nodpi ELEMENTAL_129.md ELEMENTAL_129_VALIDATION.json ELEMENTAL_130.md ELEMENTAL_130_VALIDATION.json ELEMENTAL_131.md ELEMENTAL_131_VALIDATION.json ELEMENTAL_132.md
          git commit -m "Clean 133 — remove Elemental system completely"
          git push origin HEAD:remove-elemental-133
