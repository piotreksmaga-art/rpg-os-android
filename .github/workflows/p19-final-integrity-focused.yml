name: Phase 19 final integrity focused
on:
  push:
    branches: [ "agent/p19-final-integrity-hardening" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Phase 19 final integrity focused tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.rpgos.app.Phase19FinalIntegrityHardeningTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19AuthorityFreshnessTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19AtomicAuthorityTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19PackageContentAuthorityTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19FinalHotfixTest'
          --tests 'com.rpgos.app.WorldRuleProviderPhase19HardeningTest'
          --tests 'com.rpgos.app.WorldRuleProviderDeterminismRegressionTest'
          --stacktrace
# exact-corrected-fixture-head
