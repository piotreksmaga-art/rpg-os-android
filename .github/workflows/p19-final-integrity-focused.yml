name: Phase 19 final integrity full candidate gate
on:
  push:
    branches: [ "agent/p19-final-integrity-hardening" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run full JVM unit test suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble validation build
        run: gradle --no-daemon :app:assembleDebug --stacktrace
