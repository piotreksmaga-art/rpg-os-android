name: Phase 19 package-content fix tests

on:
  push:
    branches: [ "agent/p19-package-content-toctou-fix" ]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Focused Phase 19 authority tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests '*WorldRuleProviderPhase19PackageContentAuthorityTest*'
          --tests '*WorldRuleProviderPhase19AuthorityFreshnessTest*'
          --tests '*WorldRuleProviderPhase19AtomicAuthorityTest*'
          --tests '*WorldRuleProviderPhase19FinalHotfixTest*'
          --stacktrace
