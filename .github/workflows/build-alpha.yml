name: Build RPG OS ALPHA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace

      - name: Build ALPHA APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename ALPHA APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RPG-OS-ALPHA-1.2.0-alpha1.apk
          sha256sum RPG-OS-ALPHA-1.2.0-alpha1.apk

      - name: Upload ALPHA APK
        uses: actions/upload-artifact@v4
        with:
          name: RPG-OS-ALPHA-1.2.0-alpha1
          path: RPG-OS-ALPHA-1.2.0-alpha1.apk
          if-no-files-found: error
