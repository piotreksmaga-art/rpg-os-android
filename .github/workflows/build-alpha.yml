name: Build & Release RPG OS ALPHA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Unable to read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=RPG-OS-ALPHA-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

          echo "Building RPG OS ALPHA $VERSION_NAME ($VERSION_CODE)"

      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace

      - name: Build ALPHA APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk }}"
          sha256sum "${{ steps.version.outputs.apk }}" | tee "${{ steps.version.outputs.apk }}.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPG-OS-ALPHA-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.apk }}" \
            "${{ steps.version.outputs.apk }}.sha256" \
            --title "RPG OS ALPHA ${{ steps.version.outputs.name }}" \
            --notes "Automatyczne wydanie RPG OS ALPHA.

          Wersja: ${{ steps.version.outputs.name }}
          VersionCode: ${{ steps.version.outputs.code }}

          Plik APK:
          ${{ steps.version.outputs.apk }}

          Instalacja:
          RPG OS → Aktualizacje RPG OS → Wybierz lokalny plik APK → Zainstaluj przygotowaną aktualizację."

      - name: Update existing GitHub Release asset
        if: steps.release_check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.apk }}" \
            "${{ steps.version.outputs.apk }}.sha256" \
            --clobber

      - name: Show release information
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Release:"
          gh release view "${{ steps.version.outputs.tag }}"
