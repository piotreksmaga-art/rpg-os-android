name: Validate RPG OS ALPHA

on:
  workflow_dispatch:
  pull_request:
    branches: [ "chat2-phase35-review-ci" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace
      - name: Run Phase 35 targeted JVM tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest --stacktrace
          --tests "com.rpgos.app.Phase35CanonDivergenceTest"
          --tests "com.rpgos.app.Phase35PostAuditRepairTest"
          --tests "com.rpgos.app.Phase35RawSqlAuthorityClosureTest"
          --tests "com.rpgos.app.Phase30To36PostAuditHardeningTest"
          --tests "com.rpgos.app.Phase27TurnTransactionTest"
          --tests "com.rpgos.app.Phase30EventStoreTest"
          --tests "com.rpgos.app.Phase26MutationBoundaryTest"
          --tests "com.rpgos.app.Phase19CanonicalAuthorityTest"
          --tests "com.rpgos.app.Phase19CanonicalCoherenceTest"
      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
