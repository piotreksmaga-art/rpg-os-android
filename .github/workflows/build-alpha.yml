name: Validate RPG OS ALPHA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Unable to read app version."
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=RPG-OS-ALPHA-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.RPGOS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RPGOS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RPGOS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing RPG OS signing secrets."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rpgos-release.jks"
          chmod 600 "$RUNNER_TEMP/rpgos-release.jks"

          echo "RPGOS_KEYSTORE_PATH=$RUNNER_TEMP/rpgos-release.jks" >> "$GITHUB_ENV"
          echo "RPGOS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RPGOS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate release workflow separation
        run: python3 tools/validate_release_workflows.py

      - name: Validate project
        run: gradle --no-daemon :app:tasks --stacktrace

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Upload failed unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RPG-OS-FAILED-TESTS-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 1

      - name: Build signed validation APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare immutable validation artifact
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"
          SHA=$(sha256sum "${{ steps.version.outputs.apk }}" | awk '{print $1}')
          printf '%s  %s\n' "$SHA" "${{ steps.version.outputs.apk }}" \
            > "${{ steps.version.outputs.apk }}.sha256"

          cat > build-provenance.json <<EOF
          {
            "schema": 1,
            "head_sha": "${{ github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "version_name": "${{ steps.version.outputs.name }}",
            "version_code": ${{ steps.version.outputs.code }},
            "apk_sha256": "$SHA",
            "publication": false
          }
          EOF

      - name: Upload immutable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPG-OS-VALIDATION-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
            build-provenance.json
          if-no-files-found: error
          retention-days: 14
