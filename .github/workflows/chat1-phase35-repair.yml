name: Chat1 Phase35 Repair

on:
  push:
    branches: [ "chat1-phase35-36-post-audit-repair" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat1-phase35-36-post-audit-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply Phase35 repair
        run: |
          python3 tools/chat1_p35_core_patch.py
          python3 tools/chat1_p35_integration_patch.py
          python3 tools/chat1_p35_test_patch.py
      - name: Targeted Phase35 tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase35CanonDivergenceTest' --tests 'com.rpgos.app.Phase30To36PostAuditHardeningTest' --stacktrace
      - name: Commit green Phase35 repair
        run: |
          rm tools/chat1_p35_core_patch.py tools/chat1_p35_integration_patch.py tools/chat1_p35_test_patch.py
          git config user.name "chat1-rpgos-repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rpgos/app/Phase35CanonDivergence.kt app/src/main/java/com/rpgos/app/WorldRuleProvider.kt app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt app/src/main/java/com/rpgos/app/TurnTransaction.kt app/src/test/java/com/rpgos/app/Phase35CanonDivergenceTest.kt app/src/test/java/com/rpgos/app/Phase30To36PostAuditHardeningTest.kt tools
          git commit -m "fix: harden Phase 35 canon divergence authority"
          git push origin HEAD:chat1-phase35-36-post-audit-repair
