name: P19 Writer Crash Focused
on:
  push:
    branches: [agent/p19-writer-crash-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Focused writer crash hardening tests
        run: gradle :app:testDebugUnitTest --tests com.rpgos.app.Phase19WriterCrashRecoveryHardeningTest --tests com.rpgos.app.Phase19FinalIntegrityHardeningTest --stacktrace
