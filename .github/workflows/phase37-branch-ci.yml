name: Phase37 Branch Integration

on:
  push:
    branches: [ "chat1-phase37-world-actor-knowledge" ]

permissions:
  contents: write

concurrency:
  group: phase37-branch-integration
  cancel-in-progress: true

jobs:
  patch-and-test:
    if: contains(github.event.head_commit.message, '[p37-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chat1-phase37-world-actor-knowledge
          fetch-depth: 0

      - name: Restore accepted baseline and apply reviewed Phase37 deltas
        run: |
          python3 tools/phase37_restore_baseline_minimal.py
          python3 tools/phase37_apply_integration_patch.py
          python3 tools/phase37_apply_test_patch.py
          python3 tools/phase37_finalize_known_findings.py
          python3 tools/phase37_append_finalization_tests.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run targeted Phase37 suite
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.rpgos.app.Phase37WorldActorKnowledgeTest' --stacktrace

      - name: Run full JVM suite on patched workspace
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Commit tested Phase37 candidate
        shell: bash
        run: |
          git config user.name "rpg-os-phase37-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/rpgos/app/GameplayMutationGate.kt \
            app/src/main/java/com/rpgos/app/GameplayRuntimeBootstrap.kt \
            app/src/main/java/com/rpgos/app/Phase36SchemaVersioning.kt \
            app/src/main/java/com/rpgos/app/Phase37WorldActorKnowledge.kt \
            app/src/main/java/com/rpgos/app/PlayerChangeSetCodec.kt \
            app/src/main/java/com/rpgos/app/TurnTransaction.kt \
            app/src/main/java/com/rpgos/app/CampaignEventStore.kt \
            app/src/main/java/com/rpgos/app/WorldRuleProvider.kt \
            app/src/main/java/com/rpgos/app/PlayerDomainEngine.kt \
            app/src/main/java/com/rpgos/app/CampaignSnapshotSystem.kt \
            app/src/main/java/com/rpgos/app/ContextBuilder.kt \
            app/src/test/java/com/rpgos/app/Phase37WorldActorKnowledgeTest.kt
          git commit -m "feat(p37): finalize canonical world-actor knowledge integration"
          git push origin HEAD:chat1-phase37-world-actor-knowledge
