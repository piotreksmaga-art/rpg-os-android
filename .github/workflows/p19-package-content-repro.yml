name: Phase 19 package-content TOCTOU reproduction

on:
  push:
    branches: [ "agent/p19-package-content-toctou-repro" ]

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reproduce supported-path package-content TOCTOU
        run: gradle --no-daemon :app:testDebugUnitTest --tests '*WorldRuleProviderPhase19PackageContentToctouReproTest*' --stacktrace
